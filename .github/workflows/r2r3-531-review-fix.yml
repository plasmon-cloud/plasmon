name: R2R3 #531 review fix

on:
  push:
    branches:
      - cleanup/r2r3-quarantine-model-v2
    paths:
      - .github/workflows/r2r3-531-review-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/r2r3-quarantine-model-v2
          fetch-depth: 0
      - name: Apply review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s) of {old!r}, found {found}")
              p.write_text(text.replace(old, new))

          # @quarantine is a fixed Playwright/CI contract, not runtime configuration.
          replace(
              '.github/workflows/plasmon-browser-ci.yml',
              '            QUARANTINE_MARKER="$(node test/ci/plasmon-quarantine.mjs --marker)"\n            NEUTRON_NDEPLOY_CONFIG=plasmon.ndeploy.json npx --no-install playwright test --workers=1 --retries=0 --grep-invert "$QUARANTINE_MARKER" \\\n',
              '            NEUTRON_NDEPLOY_CONFIG=plasmon.ndeploy.json npx --no-install playwright test --workers=1 --retries=0 --grep-invert @quarantine \\\n',
          )
          replace(
              '.github/workflows/plasmon-flake-probe-label.yml',
              '          QUARANTINE_MARKER="$(node test/ci/plasmon-quarantine.mjs --marker)"\n',
              '',
          )
          replace(
              '.github/workflows/plasmon-flake-probe-label.yml',
              'Direct labeled targets run with `--workers=1 --retries=0 --grep-invert $QUARANTINE_MARKER`.',
              'Direct labeled targets run with `--workers=1 --retries=0 --grep-invert @quarantine`.',
          )

          replace(
              'test/ci/run-plasmon-flake-probe.sh',
              'quarantine_marker="$(node test/ci/plasmon-quarantine.mjs --marker)"\n',
              '',
          )
          replace(
              'test/ci/run-plasmon-flake-probe.sh',
              '      --grep-invert "$quarantine_marker" \\\n',
              '      --grep-invert @quarantine \\\n',
          )
          replace(
              'test/ci/run-plasmon-flake-probe.sh',
              '    run_one test/e2e/plasmon-demo-game.spec.ts --grep "saved js-dos resource publishes a blob-backed preview after save"\n',
              '    run_one test/e2e/plasmon-demo-game.spec.ts --grep @saved-preview\n',
          )

          replace(
              'test/ci/run-plasmon-specialist.mjs',
              "import { quarantineMarker } from './plasmon-quarantine.mjs';\n",
              '',
          )
          replace(
              'test/ci/run-plasmon-specialist.mjs',
              '    quarantineMarker,\n',
              "    '@quarantine',\n",
          )

          replace(
              'test/e2e/plasmon-demo-game.spec.ts',
              '{ tag: ["@quarantine", "@issue-124", "@issue-304"] },',
              '{ tag: ["@quarantine", "@saved-preview", "@issue-124", "@issue-304"] },',
          )

          replace(
              'test/ci/plasmon-quarantine.json',
              '  "marker": "@quarantine",\n',
              '',
          )
          replace(
              'test/ci/plasmon-quarantine.json',
              '      "path": "test/e2e/plasmon-demo-game.spec.ts",\n',
              '      "path": "test/e2e/plasmon-demo-game.spec.ts",\n      "selectorTag": "@saved-preview",\n',
          )

          Path('test/ci/plasmon-quarantine.mjs').write_text('''import { readFileSync } from 'node:fs';
          import { dirname, resolve } from 'node:path';
          import { fileURLToPath } from 'node:url';

          const here = dirname(fileURLToPath(import.meta.url));
          const inventoryPath = resolve(here, 'plasmon-quarantine.json');

          export function loadQuarantineInventory(path = inventoryPath) {
            const inventory = JSON.parse(readFileSync(path, 'utf8'));
            if (inventory?.schemaVersion !== 1) throw new Error('Unsupported Plasmon quarantine inventory schema');
            if (!Array.isArray(inventory.entries)) throw new Error('Quarantine entries must be an array');

            const ids = new Set();
            const selectorTags = new Set();
            for (const entry of inventory.entries) {
              if (!entry || typeof entry !== 'object') throw new Error('Quarantine entry must be an object');
              if (typeof entry.id !== 'string' || !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(entry.id)) {
                throw new Error(`Invalid semantic quarantine id: ${entry?.id ?? '(missing)'}`);
              }
              if (ids.has(entry.id)) throw new Error(`Duplicate quarantine id: ${entry.id}`);
              ids.add(entry.id);
              if (typeof entry.path !== 'string' || !entry.path.startsWith('test/e2e/')) {
                throw new Error(`Invalid quarantine path for ${entry.id}`);
              }
              if (typeof entry.selectorTag !== 'string' || !/^@[a-z][a-z0-9-]*$/.test(entry.selectorTag)) {
                throw new Error(`Invalid semantic selector tag for ${entry.id}`);
              }
              if (entry.selectorTag === '@quarantine' || /^@(issue|pr|r\\d)/i.test(entry.selectorTag)) {
                throw new Error(`Quarantine selector for ${entry.id} must be behavioral, not provenance or quarantine state`);
              }
              if (selectorTags.has(entry.selectorTag)) throw new Error(`Duplicate quarantine selector: ${entry.selectorTag}`);
              selectorTags.add(entry.selectorTag);
              if (typeof entry.title !== 'string' || entry.title.trim().length === 0) {
                throw new Error(`Missing descriptive test title for ${entry.id}`);
              }
              if (typeof entry.active !== 'boolean') throw new Error(`Missing active state for ${entry.id}`);
              if (typeof entry.classification !== 'string' || entry.classification.trim().length === 0) {
                throw new Error(`Missing debt classification for ${entry.id}`);
              }
              if (!Number.isInteger(entry.repairIssue) || entry.repairIssue <= 0) {
                throw new Error(`Missing current repair Issue for ${entry.id}`);
              }
              if (typeof entry.exitCriteria !== 'string' || !entry.exitCriteria.includes('retries=0')) {
                throw new Error(`Exit criteria for ${entry.id} must require retry-free proof`);
              }
            }
            return Object.freeze({
              ...inventory,
              entries: Object.freeze(inventory.entries.map((entry) => Object.freeze({ ...entry }))),
            });
          }

          export const quarantineInventory = loadQuarantineInventory();
          export const activeQuarantines = Object.freeze(quarantineInventory.entries.filter((entry) => entry.active));

          export function activeQuarantinesForPath(path, entries = activeQuarantines) {
            return entries.filter((entry) => entry.path === path && entry.active !== false);
          }

          function countQuarantineTags(source) {
            return (String(source).match(/tag:\\s*\\[[^\\]]*\\]/g) ?? [])
              .filter((block) => block.includes('"@quarantine"') || block.includes("'@quarantine'"))
              .length;
          }

          export function isFullyQuarantinedSource(path, source, entries = activeQuarantines) {
            const pathEntries = activeQuarantinesForPath(path, entries);
            if (pathEntries.length === 0) return false;
            const text = String(source);
            const testCount = [...text.matchAll(/\\btest(?:\\.[A-Za-z]+)*\\s*\\(/g)].length;
            if (testCount === 0 || pathEntries.length !== testCount || countQuarantineTags(text) !== testCount) return false;
            return pathEntries.every((entry) =>
              text.includes(`"${entry.selectorTag}"`) || text.includes(`'${entry.selectorTag}'`),
            );
          }

          if (process.argv[1] && resolve(process.argv[1]) === fileURLToPath(import.meta.url)) {
            if (process.argv.includes('--active-json')) process.stdout.write(`${JSON.stringify(activeQuarantines)}\\n`);
            else throw new Error('usage: node test/ci/plasmon-quarantine.mjs --active-json');
          }
          '''.replace(/^          /gm, ''))

          replace(
              'test/ci/QUARANTINED_BROWSER_TESTS.md',
              'The executable quarantine authority is [`plasmon-quarantine.json`](./plasmon-quarantine.json). Required browser CI and Flake Probe must read the stable `@quarantine` marker from that inventory rather than defining a release-specific selector of their own.',
              'Required browser CI and Flake Probe use the fixed Playwright tag `@quarantine`. [`plasmon-quarantine.json`](./plasmon-quarantine.json) records which exact semantic acceptances are authorized debt; it does not configure the quarantine tag itself.',
          )
          replace(
              'test/ci/QUARANTINED_BROWSER_TESTS.md',
              '| `saved-jsdos-preview-publication` — `saved js-dos resource publishes a blob-backed preview after save` | known flaky | #304 |',
              '| `saved-jsdos-preview-publication` / `@saved-preview` — `saved js-dos resource publishes a blob-backed preview after save` | known flaky | #304 |',
          )

          # Verification contracts now assert the fixed quarantine tag and semantic targeted selector.
          replace(
              'test/ci/verify-flake-probe.mjs',
              '  quarantineMarker,\n',
              '',
          )
          replace(
              'test/ci/verify-flake-probe.mjs',
              '  "quarantine_marker=\\\"$(node test/ci/plasmon-quarantine.mjs --marker)\\\"",\n',
              '',
          )
          replace(
              'test/ci/verify-flake-probe.mjs',
              '  "--grep-invert \\\"$quarantine_marker\\\"",\n',
              '  "--grep-invert @quarantine",\n',
          )
          replace(
              'test/ci/verify-flake-probe.mjs',
              '  "saved js-dos resource publishes a blob-backed preview after save",\n',
              '  "--grep @saved-preview",\n',
          )
          replace(
              'test/ci/verify-flake-probe.mjs',
              '  "quarantineMarker",\n  "./plasmon-quarantine.mjs",\n',
              '  "@quarantine",\n',
          )
          replace(
              'test/ci/verify-flake-probe.mjs',
              '    `test("synthetic quarantine fixture", { tag: ["${quarantineMarker}"] }, async () => {});`,\n',
              '    `test("synthetic quarantine fixture", { tag: ["@quarantine", "@synthetic-quarantine"] }, async () => {});`,\n',
          )
          replace(
              'test/ci/verify-flake-probe.mjs',
              '    path: syntheticPath,\n    title: "synthetic quarantine fixture",\n',
              '    path: syntheticPath,\n    selectorTag: "@synthetic-quarantine",\n    title: "synthetic quarantine fixture",\n',
          )

          replace(
              'test/ci/verify-labeled-flake-probe.mjs',
              '  "QUARANTINE_MARKER=\\\"$(node test/ci/plasmon-quarantine.mjs --marker)\\\"",\n  "--workers=1 --retries=0 --grep-invert $QUARANTINE_MARKER",\n',
              '  "--workers=1 --retries=0 --grep-invert @quarantine",\n',
          )
          replace(
              'test/ci/verify-labeled-flake-probe.mjs',
              '  "quarantine_marker=\\\"$(node test/ci/plasmon-quarantine.mjs --marker)\\\"",\n  "--grep-invert \\\"$quarantine_marker\\\"",\n',
              '  "--grep-invert @quarantine",\n',
          )

          replace(
              'test/ci/verify-playwright-packet-lifecycle.mjs',
              '  "quarantine_marker=\\\"$(node test/ci/plasmon-quarantine.mjs --marker)\\\"",\n',
              '',
          )
          replace(
              'test/ci/verify-playwright-packet-lifecycle.mjs',
              '  "--grep-invert \\\"$quarantine_marker\\\"",\n',
              '  "--grep-invert @quarantine",\n',
          )

          replace(
              'test/ci/verify-plasmon-test-inventory.mjs',
              '  quarantineMarker,\n',
              '',
          )
          replace(
              'test/ci/verify-plasmon-test-inventory.mjs',
              '.filter((block) => block.includes(`"${quarantineMarker}"`) || block.includes(`\'${quarantineMarker}\'`));',
              '.filter((block) => block.includes(\'"@quarantine"\') || block.includes("\'@quarantine\'"));',
          )
          replace(
              'test/ci/verify-plasmon-test-inventory.mjs',
              "  assert(specialistRunner.includes('quarantineMarker'), 'Specialist acceptance must read the shared quarantine marker authority');\n",
              "  assert(specialistRunner.includes('--grep-invert') && specialistRunner.includes('@quarantine'), 'Specialist acceptance must exclude exactly the fixed @quarantine tag');\n",
          )
          replace(
              'test/ci/verify-plasmon-test-inventory.mjs',
              '      `${test.path} has ${quarantineTags.length} ${quarantineMarker} tag(s), but active quarantine inventory authorizes ${expected.length}`,\n',
              '      `${test.path} has ${quarantineTags.length} @quarantine tag(s), but active quarantine inventory authorizes ${expected.length}`,\n',
          )
          replace(
              'test/ci/verify-plasmon-test-inventory.mjs',
              '    for (const entry of expected) {\n      assert(source.includes(`"${entry.title}"`) || source.includes(`\'${entry.title}\'`), `${entry.id} title is missing from ${entry.path}`);\n    }\n',
              '    for (const entry of expected) {\n      assert(source.includes(`"${entry.selectorTag}"`) || source.includes(`\'${entry.selectorTag}\'`), `${entry.id} semantic selector ${entry.selectorTag} is missing from ${entry.path}`);\n    }\n',
          )
          replace(
              'test/ci/verify-plasmon-test-inventory.mjs',
              "  assert(browserWorkflow.includes('plasmon-quarantine.mjs --marker'), 'Required demo CI must read the shared quarantine marker authority');\n",
              "  assert(browserWorkflow.includes('--grep-invert @quarantine'), 'Required demo CI must exclude exactly the fixed @quarantine tag');\n",
          )

          # No executable selector may depend on the mutable English test title.
          for path in [
              'test/ci/run-plasmon-flake-probe.sh',
              'test/ci/verify-flake-probe.mjs',
          ]:
              text = Path(path).read_text()
              if '--grep "saved js-dos resource publishes a blob-backed preview after save"' in text:
                  raise SystemExit(f'{path}: mutable title selector remains')

          # Remove this one-shot bootstrap from the final branch tree.
          Path('.github/workflows/r2r3-531-review-fix.yml').unlink()
          PY

          node test/ci/verify-flake-probe.mjs
          node test/ci/verify-labeled-flake-probe.mjs
          node test/ci/verify-playwright-packet-lifecycle.mjs
          node test/ci/verify-plasmon-test-inventory.mjs

          git config user.name "plasmon-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "#531 Address quarantine selector review"
          git push origin HEAD:cleanup/r2r3-quarantine-model-v2
