name: Issue 167 Lockfile Helper

on:
  push:
    branches:
      - work/testing/167-r2-shared-rtl-harness
    paths:
      - "apps/plasmon/package.json"
      - ".github/workflows/issue-167-lockfile.yml"

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/testing/167-r2-shared-rtl-harness
      - name: Generate npm lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        run: |
          set -euxo pipefail
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(testing): refresh lockfile for #167"
          git push origin HEAD:work/testing/167-r2-shared-rtl-harness
