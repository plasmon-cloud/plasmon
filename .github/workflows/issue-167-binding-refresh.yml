name: Issue 167 Candidate Binding Refresh

on:
  push:
    branches:
      - work/testing/167-r2-shared-rtl-harness
    paths:
      - ".github/workflows/issue-167-binding-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-binding:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/testing/167-r2-shared-rtl-harness
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Materialize canonical Kernel package inputs and regenerate binding
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm ci
            npm --workspace neutron-kernel run package
            npm --workspace neutron-kernel run certified-assets:candidate-binding:write
          '
      - name: Commit generated candidate binding
        run: |
          set -euxo pipefail
          git diff -- apps/kernel/certified-assets-candidate-binding.json
          if git diff --quiet -- apps/kernel/certified-assets-candidate-binding.json; then
            echo "Candidate binding already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/kernel/certified-assets-candidate-binding.json
          git commit -m "test(kernel): refresh Certified Assets candidate binding for #167"
          git push origin HEAD:work/testing/167-r2-shared-rtl-harness
