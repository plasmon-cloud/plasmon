name: Experiment Cmd V1 Test Fix

on:
  push:
    branches:
      - experiment/cmd
    paths:
      - .github/workflows/experiment-cmd-v1-test-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: experiment/cmd
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Correct and strengthen v1 regression expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/plasmon/src/scripting/v1-regression.test.ts')
          text = path.read_text()

          start = text.index('  test("wc, sort, uniq, and tee option behavior composes predictably"')
          end = text.index('  test("unknown commands, argument arity, and exit status validation use shell-like statuses"', start)
          replacement = '''  test("wc, sort, uniq, and tee option behavior composes predictably", async () => {
            await withSession(async (session, env) => {
              const wc = await session.shell.pipeline([session.commands.echo(["one", "two"]), session.commands.wc(["-lwc"])]).run();
              expect(wc.stdout).toBe("1 2 8\\n");

              await env.os.fs.writeText("/Documents/sort.txt", "a\\nc\\nb\\n");
              const sorted = await session.shell.pipeline([session.commands.sort(["-r", "/Documents/sort.txt"])]).run();
              expect(sorted).toEqual({ exitCode: 0, stdout: "c\\nb\\na\\n", stderr: "" });

              await env.os.fs.writeText("/Documents/uniq.txt", "a\\na\\nb\\nb\\nb\\nc\\n");
              const uniq = await session.shell.pipeline([session.commands.uniq(["-c", "/Documents/uniq.txt"])]).run();
              expect(uniq).toEqual({ exitCode: 0, stdout: "2 a\\n3 b\\n1 c\\n", stderr: "" });

              await env.os.fs.writeText("/Documents/tee.txt", "before\\n");
              const tee = await session.shell.pipeline([session.commands.echo(["after"]), session.commands.tee(["-a", "/Documents/tee.txt"])]).run();
              expect(tee.stdout).toBe("after\\n");
              expect(await env.os.fs.readText("/Documents/tee.txt")).toBe("before\\nafter\\n");
            });
          });

'''
          text = text[:start] + replacement + text[end:]

          start = text.index('  test("unknown commands, argument arity, and exit status validation use shell-like statuses"')
          end = text.index('});\n\ndescribe(".cmd/.run service and transpiler regressions"', start)
          replacement = '''  test("unknown commands, argument arity, and exit status validation use shell-like statuses", async () => {
            await withSession(async (session) => {
              const unknown = await session.shell.pipeline([session.commands.command("definitely-not-a-command")]).run();
              expect(unknown.exitCode).toBe(127);
              expect(unknown.stderr).toContain("command not found");
              expect((await session.shell.pipeline([session.commands.pwd(["extra"])]).run()).exitCode).toBe(2);
              expect((await session.shell.pipeline([session.commands.ps(["extra"])]).run()).exitCode).toBe(2);

              for (const args of [["-1"], ["256"], ["abc"], ["1", "2"]]) {
                const invalidExit = await session.shell.pipeline([session.commands.exit(args)]).run();
                expect(invalidExit.exitCode).toBe(2);
                expect(invalidExit.stderr).toBe("exit: expected status 0-255\\n");
              }

              for (const [args, expectedStatus] of [[[], 0], [["255"], 255]] as const) {
                try {
                  await session.shell.pipeline([session.commands.exit(args)]).run();
                  throw new Error("valid exit must terminate the command session");
                } catch (error) {
                  expect(error).toBeInstanceOf(CommandExit);
                  expect((error as CommandExit).exitCode).toBe(expectedStatus);
                }
              }
            });
          });
'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
          git rm .github/workflows/experiment-cmd-v1-test-fix.yml
      - run: npm ci
      - name: Run full Plasmon test suite
        run: npm --workspace neutron-plasmon test
      - name: Hygiene
        run: git diff --check
      - name: Commit verified regression corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/plasmon/src/scripting/v1-regression.test.ts
          git commit -am "Test: strengthen cmd v1 regression matrix"
          git push origin HEAD:experiment/cmd
