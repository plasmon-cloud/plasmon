name: Experiment Cmd Run CI

on:
  push:
    branches:
      - experiment/cmd
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experiment-cmd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v6
        with:
          ref: experiment/cmd
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply pending finishing slice
        if: ${{ hashFiles('tools/experiment_cmd_finish.py') != '' }}
        run: python3 tools/experiment_cmd_finish.py

      - name: Reconcile canonical scripting fixture
        if: ${{ hashFiles('tools/experiment_cmd_finish.py') != '' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/plasmon/src/scripting/experiment.test.ts')
          text = path.read_text()
          old = '    const destination = await env.services.scripting.transpileCmdFile("/Documents/demo.cmd");'
          new = '    const scripting = new ScriptingService({ os: env.os });\n    const destination = await scripting.transpileCmdFile("/Documents/demo.cmd");'
          if old not in text:
              raise SystemExit('expected stale scripting fixture reference not found')
          path.write_text(text.replace(old, new))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Plasmon fast suite
        run: npm --workspace neutron-plasmon test

      - name: Build slim experiment
        env:
          PLASMON_PACKAGE_PROFILE: slim
        run: npm --workspace neutron-plasmon run build

      - name: Verify TypeScript worker is packaged
        run: |
          set -euxo pipefail
          test -f 'apps/plasmon/dist/web/System/Program Files/MonacoEditor/editor.worker.js'
          test -f 'apps/plasmon/dist/web/System/Program Files/MonacoEditor/ts.worker.js'
          wc -c 'apps/plasmon/dist/web/System/Program Files/MonacoEditor/editor.worker.js'
          wc -c 'apps/plasmon/dist/web/System/Program Files/MonacoEditor/ts.worker.js'

      - name: Diff hygiene
        run: git diff --check

      - name: Commit verified finishing slice
        if: ${{ hashFiles('tools/experiment_cmd_finish.py') != '' }}
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/experiment_cmd_finish.py
          git add -A
          git commit -m 'Experiment: adopt canonical OsApi and v1 commands'
          git push origin HEAD:experiment/cmd
