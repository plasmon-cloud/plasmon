name: Simplify v6.6 flake check

on:
  push:
    branches: ["automation/train-snapshot"]
    paths: [".github/workflows/v66-flake-simplify.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/train-snapshot
      - name: Patch snapshot helper atomically
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/plasmon-train-snapshot.yml')
          s = p.read_text()
          old = '''          def flake_check(name):\n              text = str(name or "").lower()\n              return "flake probe" in text or "flake characterization" in text\n'''
          new = '''          def flake_check(name):\n              return "flake" in str(name or "").lower()\n'''
          if old not in s:
              raise SystemExit('expected flake_check block not found')
          p.write_text(s.replace(old, new))
          PY
          SHA=$(gh api "repos/$REPO/contents/.github/workflows/plasmon-train-snapshot.yml?ref=automation/train-snapshot" --jq .sha)
          CONTENT=$(base64 -w0 .github/workflows/plasmon-train-snapshot.yml)
          gh api --method PUT "repos/$REPO/contents/.github/workflows/plasmon-train-snapshot.yml" \
            -f message='Simplify v6.6 flake check classification' \
            -f content="$CONTENT" \
            -f sha="$SHA" \
            -f branch='automation/train-snapshot'
