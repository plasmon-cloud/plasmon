name: Issue 268 viewport-stable pointer patch

on:
  push:
    branches:
      - ci/issue-268-viewport-reachability-sync

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/issue-268-viewport-reachability-sync
          fetch-depth: 0
      - name: Apply focused browser synchronization repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/e2e/plasmon-golden-path.spec.ts')
          text = path.read_text()
          start_marker = '  const normalTitlebarBox = await titlebar.boundingBox();\n'
          end_marker = '  await page.mouse.move(workspace.x + Math.min(240, workspace.width / 2), normalDragY, { steps: 8 });\n'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('start marker not found')
          end_start = text.find(end_marker, start)
          if end_start < 0:
              raise SystemExit('end marker not found')
          end = end_start + len(end_marker)
          replacement = '''  // The hit-test above runs inside the Plasmon iframe, while Locator.boundingBox()
            // reports main-frame coordinates. After a viewport restore the WindowLayer ResizeObserver
            // can still reconcile native geometry between those two observations. Let Playwright
            // re-resolve the same rendered titlebar point through its stable/receives-events
            // actionability boundary, then keep the real top-level pointerdown/drag path below.
            await titlebar.hover({ position: normalDragPoint });
            await page.mouse.down();
            await expect(dialog).toHaveAttribute("data-interacting", "drag");
            const draggingTitlebarBox = await titlebar.boundingBox();
            if (!draggingTitlebarBox) throw new Error("Dragging native titlebar has no browser bounds");
            const normalDragY = draggingTitlebarBox.y + normalDragPoint.y;
            await page.mouse.move(workspace.x + Math.min(240, workspace.width / 2), normalDragY, { steps: 8 });
            '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          git rm .github/workflows/issue-268-viewport-sync-patch.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add test/e2e/plasmon-golden-path.spec.ts
          git commit -m '#268 Stabilize restored titlebar pointer targeting'
          git push origin HEAD:ci/issue-268-viewport-reachability-sync