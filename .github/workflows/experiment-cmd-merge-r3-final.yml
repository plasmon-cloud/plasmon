name: Experiment Cmd Merge R3 Final

on:
  push:
    branches:
      - experiment/cmd
    paths:
      - .github/workflows/experiment-cmd-merge-r3-final.yml

permissions:
  contents: write

jobs:
  merge-r3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: experiment/cmd
          fetch-depth: 0
      - name: Merge and resolve the three known conflicts
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin release/0.1.0-r3
          set +e
          git merge --no-commit --no-ff origin/release/0.1.0-r3
          status=$?
          set -e
          test "$status" -ne 0

          actual="$(git diff --name-only --diff-filter=U | sort)"
          expected="$(printf '%s\n' apps/plasmon/build.ts apps/plasmon/src/native-apps/shared/monaco/monacoEnvironment.test.ts apps/plasmon/src/os/integration/services.ts | sort)"
          test "$actual" = "$expected"

          git checkout --theirs -- apps/plasmon/build.ts apps/plasmon/src/os/integration/services.ts
          git checkout --ours -- apps/plasmon/src/native-apps/shared/monaco/monacoEnvironment.test.ts

          python3 - <<'PY'
          from pathlib import Path

          def once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected one match, found {text.count(old)}")
              return text.replace(old, new, 1)

          p = Path('apps/plasmon/build.ts')
          t = p.read_text()
          t = once(
              t,
              'const slimMonacoEntryPoints = monacoEntryPoints.filter(({ out }) =>\n  out === "System/Program Files/MonacoEditor/editor.worker"\n);',
              'const slimMonacoEntryPoints = monacoEntryPoints.filter(({ out }) =>\n  out.endsWith("/editor.worker") || out.endsWith("/ts.worker")\n);',
              'slim Monaco worker policy',
          )
          p.write_text(t)

          p = Path('apps/plasmon/src/os/integration/services.ts')
          t = p.read_text()
          t = once(
              t,
              'import { IntegratedOpenService } from "./openService.ts";\nimport { isGameRuntimeProfile } from "./packageProfile.ts";',
              'import { IntegratedOpenService } from "./openService.ts";\nimport { isCoreProfile, isGameRuntimeProfile } from "./packageProfile.ts";\nimport { createPlasmonOsApi } from "../api/adapter.ts";\nimport { ScriptingService } from "../../scripting/service.ts";\nimport {\n  createTerminalNativeLoader,\n  terminalAppDefinition,\n  terminalAssociationRules,\n  terminalHandler,\n} from "../../native-apps/terminal/index.ts";',
              'integration imports',
          )
          t = once(
              t,
              '    hiddenVisibility,\n    nativeAppLog,\n  );\n\n  filesystem = createFilesystemCore({',
              '    hiddenVisibility,\n    nativeAppLog,\n  );\n  if (!isCoreProfile) {\n    associations.registerHandler(terminalHandler);\n    for (const rule of terminalAssociationRules) associations.registerRule(rule);\n    nativeApps.register(terminalAppDefinition);\n  }\n\n  filesystem = createFilesystemCore({',
              'terminal registration',
          )
          marker = '  const startMenu = new StartMenuReconciliationController(fs, nativeApps, neutron, {'
          i = t.find(marker)
          if i < 0:
              raise SystemExit('start-menu composition seam missing')
          t = t[:i] + '''  const startMenu = new StartMenuReconciliationController(fs, nativeApps, neutron, {\n    diagnostics: shellLog,\n  });\n  const services: PlasmonServices = {\n    fs,\n    fsEvents: fs,\n    filesystem,\n    diagnostics,\n    process,\n    windows,\n    windowPlacement,\n    neutron,\n    authorization: createAuthorizationService(),\n    nativeApps,\n    associations,\n    openService,\n    fileClipboard,\n    startMenu,\n    hiddenVisibility,\n  };\n\n  const scripting = new ScriptingService({ os: createPlasmonOsApi({ services }) });\n  nativeApps.setLoader(\n    explorerAppDefinition.id,\n    createExplorerNativeLoader({\n      fsEvents: fs,\n      associations,\n      openService,\n      openAuthority: fileManagerOpenAuthority,\n      trashAuthority: fileManagerTrashAuthority,\n      clipboard: fileClipboard,\n      hiddenVisibility,\n      transpileCmdFile: async (nodeId) => scripting.transpileCmdFile(await fs.pathOf(nodeId)),\n    }),\n  );\n  if (!isCoreProfile) nativeApps.setLoader(terminalAppDefinition.id, createTerminalNativeLoader({ scripting }));\n\n  return services;\n}\n'''
          p.write_text(t)
          PY

          git add apps/plasmon/build.ts apps/plasmon/src/native-apps/shared/monaco/monacoEnvironment.test.ts apps/plasmon/src/os/integration/services.ts
          test -z "$(git diff --name-only --diff-filter=U)"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - name: Plasmon fast suite and capture failure
        run: |
          set +e
          npm --workspace neutron-plasmon test > /tmp/plasmon-fast.log 2>&1
          status=$?
          set -e
          cat /tmp/plasmon-fast.log
          if [ "$status" -ne 0 ]; then
            git merge --abort
            cp /tmp/plasmon-fast.log .github/experiment-cmd-r3-test-failure.txt
            git add .github/experiment-cmd-r3-test-failure.txt
            git commit -m 'CI: record cmd merge test failure'
            git push origin HEAD:experiment/cmd
            exit 78
          fi
      - name: Base build
        run: npm --workspace neutron-plasmon run build
      - name: Slim build
        env:
          PLASMON_PACKAGE_PROFILE: slim
        run: npm --workspace neutron-plasmon run build
      - name: Commit real merge
        run: |
          set -euxo pipefail
          test -f 'apps/plasmon/dist/web/System/Program Files/MonacoEditor/editor.worker.js'
          test -f 'apps/plasmon/dist/web/System/Program Files/MonacoEditor/ts.worker.js'
          git diff --check
          git rm -f .github/workflows/experiment-cmd-merge-r3.yml .github/workflows/experiment-cmd-merge-r3-final.yml .github/experiment-cmd-r3-conflicts.txt .github/experiment-cmd-r3-test-failure.txt || true
          git add -A
          git commit -m 'Merge release/0.1.0-r3 into experiment/cmd'
          git push origin HEAD:experiment/cmd
