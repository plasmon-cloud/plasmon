name: Plasmon Packaged Smoke CI

on:
  pull_request:
    paths:
      - "apps/plasmon/**"
      - "apps/review/**"
      - "apps/kernel/**"
      - "packages/neutron-provision/**"
      - "packages/neutron-tools/**"
      - "test/e2e/plasmon-demo-environment.ts"
      - "test/e2e/plasmon-browser-health.ts"
      - "test/e2e/plasmon-refactor-smoke.spec.ts"
      - "playwright.config.ts"
      - "plasmon-local.ndeploy.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/plasmon-browser-smoke-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plasmon-browser-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-smoke:
    name: Packaged refactor smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and run Plasmon refactor smoke
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm ci
            npm run plasmon:demo:prepare

            npm run plasmon:demo:serve > /tmp/plasmon-pocketic-smoke.log 2>&1 &
            server_pid=$!
            trap '\''status=$?; kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then cat /tmp/plasmon-pocketic-smoke.log || true; fi; exit "$status"'\'' EXIT

            pocketic_ready=0
            for attempt in $(seq 1 180); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                echo "PocketIC serve exited before becoming ready" >&2
                cat /tmp/plasmon-pocketic-smoke.log >&2 || true
                exit 1
              fi
              if grep -q "^PocketIC .* is ready$" /tmp/plasmon-pocketic-smoke.log 2>/dev/null; then
                pocketic_ready=1
                break
              fi
              sleep 1
            done
            if [ "$pocketic_ready" -ne 1 ]; then
              echo "PocketIC serve did not complete startup" >&2
              cat /tmp/plasmon-pocketic-smoke.log >&2 || true
              exit 1
            fi

            npm run plasmon:demo:status
            npm run plasmon:demo:reinstall
            npm run test:e2e:plasmon:smoke
          '

      - name: Upload #217 Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue-217-playwright-diagnostics
          if-no-files-found: warn
          path: |
            playwright-report
            test-results
