name: Plasmon Packaged Smoke CI

on:
  push:
    branches:
      - 'release/**'
  pull_request:
  pull_request_review:
    types: [submitted]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plasmon-browser-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packaged-smoke:
    name: Packaged refactor smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify required-gate workflow contract
        run: node test/ci/verify-required-browser-gates.mjs smoke

      - name: Report staged smoke checkpoint
        if: ${{ github.event_name != 'workflow_dispatch' && !(github.event_name == 'pull_request_review' && github.event.review.state == 'approved') }}
        run: |
          case "${{ github.event_name }}" in
            pull_request) echo "Packaged smoke waits for normal GitHub review approval." ;;
            merge_group) echo "Packaged smoke already passed before Merge; merge queue is fast-only." ;;
            push) echo "Packaged smoke already passed before merge; post-merge Flake Probe owns stability analysis." ;;
            pull_request_review) echo "This review was not an approval; no expensive smoke work is started." ;;
          esac

      - name: Install Nix
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') }}
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and run Plasmon refactor smoke
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') }}
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm ci
            node test/ci/verify-playwright-gate.mjs
            npm run plasmon:local:prepare
            bun test apps/plasmon/test/package.test.ts

            npm run plasmon:local:serve > /tmp/plasmon-pocketic-smoke.log 2>&1 &
            server_pid=$!
            trap '\''status=$?; kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then cat /tmp/plasmon-pocketic-smoke.log || true; fi; exit "$status"'\'' EXIT

            pocketic_ready=0
            for attempt in $(seq 1 180); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                echo "PocketIC serve exited before becoming ready" >&2
                cat /tmp/plasmon-pocketic-smoke.log >&2 || true
                exit 1
              fi
              if grep -q "^PocketIC .* is ready$" /tmp/plasmon-pocketic-smoke.log 2>/dev/null; then
                pocketic_ready=1
                break
              fi
              sleep 1
            done
            if [ "$pocketic_ready" -ne 1 ]; then
              echo "PocketIC serve did not complete startup" >&2
              cat /tmp/plasmon-pocketic-smoke.log >&2 || true
              exit 1
            fi

            npm run plasmon:local:status
            npm run plasmon:local:reinstall
            npm run test:e2e:plasmon:smoke
          '
