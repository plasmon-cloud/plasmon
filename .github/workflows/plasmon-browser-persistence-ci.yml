name: Plasmon Browser Persistence CI

on:
  push:
    branches:
      - 'release/**'
  pull_request:
  pull_request_review:
    types: [submitted]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plasmon-browser-persistence-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packaged-persistence:
    name: Packaged browser persistence
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify required-gate workflow contract
        run: node test/ci/verify-required-browser-gates.mjs persistence

      - name: Report staged persistence checkpoint
        if: ${{ github.event_name != 'workflow_dispatch' && !(github.event_name == 'pull_request_review' && github.event.review.state == 'approved') }}
        run: |
          case "${{ github.event_name }}" in
            pull_request) echo "Persistence acceptance waits for normal GitHub review approval." ;;
            merge_group) echo "Persistence already passed before Merge; merge queue is fast-only." ;;
            push) echo "Persistence already passed before merge; post-merge Flake Probe owns stability analysis." ;;
            pull_request_review) echo "This review was not an approval; no expensive persistence work is started." ;;
          esac

      - name: Install Nix
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') }}
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and run browser persistence gate
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') }}
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm ci
            npm run plasmon:local:prepare

            npm run plasmon:local:serve > /tmp/plasmon-pocketic-persistence.log 2>&1 &
            server_pid=$!
            trap '\''status=$?; kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then cat /tmp/plasmon-pocketic-persistence.log || true; fi; exit "$status"'\'' EXIT

            pocketic_ready=0
            for attempt in $(seq 1 180); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                echo "PocketIC serve exited before becoming ready" >&2
                cat /tmp/plasmon-pocketic-persistence.log >&2 || true
                exit 1
              fi
              if grep -q "^PocketIC .* is ready$" /tmp/plasmon-pocketic-persistence.log 2>/dev/null; then
                pocketic_ready=1
                break
              fi
              sleep 1
            done
            if [ "$pocketic_ready" -ne 1 ]; then
              echo "PocketIC serve did not complete startup" >&2
              cat /tmp/plasmon-pocketic-persistence.log >&2 || true
              exit 1
            fi

            npm run plasmon:local:status
            # Establish one known installed baseline. The test itself never reinstalls:
            # browser restart is modeled only by closing/relaunching Chromium against
            # the same profile while this PocketIC process and installation remain live.
            npm run plasmon:local:reinstall
            npm run test:e2e:plasmon:persistence
          '

  approval-rerun-sync:
    name: Sync approval reruns
    needs: packaged-persistence
    if: ${{ always() && github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.run_attempt > 1 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout trusted rerun coordinator
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - name: Propagate approval rerun to stale failed gates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node test/ci/rerun-stale-approval-gates.mjs
