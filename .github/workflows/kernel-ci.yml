name: Kernel CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

jobs:
  kernel_scope:
    name: Determine Kernel CI applicability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_kernel: ${{ steps.kernel_scope.outputs.run_kernel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify Kernel CI skip contract
        run: node test/ci/verify-kernel-ci.mjs

      - name: Detect kernel-relevant changes
        id: kernel_scope
        shell: bash
        run: |
          set -euo pipefail

          # Push/main, release integration, merge queue, and manual runs preserve the full Kernel lane.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_kernel=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          kernel_relevant() {
            case "$1" in
              apps/plasmon/*|test/e2e/plasmon-golden-path.spec.ts|README.md|AGENTS.md|LICENSE|doc/*|.github/workflows/README.md)
                return 1
                ;;
              *)
                return 0
                ;;
            esac
          }

          ! kernel_relevant "apps/plasmon/src/index.tsx"
          ! kernel_relevant "test/e2e/plasmon-golden-path.spec.ts"
          ! kernel_relevant "doc/testing-and-verification.md"
          kernel_relevant "apps/kernel/package.json"
          kernel_relevant ".github/workflows/kernel-ci.yml"

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base_sha" "$head_sha" > /tmp/kernel-changed-files.txt
          cat /tmp/kernel-changed-files.txt

          run_kernel=false
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if kernel_relevant "$path"; then
              run_kernel=true
              break
            fi
          done < /tmp/kernel-changed-files.txt

          echo "run_kernel=$run_kernel" >> "$GITHUB_OUTPUT"
          if [ "$run_kernel" != "true" ]; then
            echo "No kernel-relevant changes; required kernel job will be skipped."
          fi

  kernel:
    name: kernel
    needs: kernel_scope
    if: ${{ always() && (needs.kernel_scope.result != 'success' || needs.kernel_scope.outputs.run_kernel == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Fail if applicability detection failed
        if: ${{ needs.kernel_scope.result != 'success' }}
        run: |
          echo "Kernel scope detection failed; refusing to satisfy required Kernel CI as not applicable." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show toolchain
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            node --version
            npm --version
            bun --version
            mops --version
          '

      - name: Install dependencies
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm ci
          '

      - name: Kernel package
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm --workspace neutron-kernel run package
          '

      - name: Kernel tests
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm --workspace neutron-kernel test
          '
