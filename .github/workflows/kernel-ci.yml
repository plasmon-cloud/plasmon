name: Kernel CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
  pull_request_review:
    types: [submitted]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  kernel_scope:
    name: Determine Kernel CI applicability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_kernel: ${{ steps.kernel_scope.outputs.run_kernel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify Kernel CI skip contract
        run: node test/ci/verify-kernel-ci.mjs

      - name: Detect retained approval
        id: retained_approval
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          owner="${REPOSITORY%%/*}"
          name="${REPOSITORY#*/}"
          decision="$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewDecision}}}' \
            -F owner="$owner" -F name="$name" -F number="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.reviewDecision')"
          if [ "$decision" = "APPROVED" ]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect kernel-relevant changes
        id: kernel_scope
        shell: bash
        run: |
          set -euo pipefail

          case "${{ github.event_name }}" in
            pull_request)
              if [ "${{ steps.retained_approval.outputs.approved }}" = "true" ]; then
                echo "run_kernel=true" >> "$GITHUB_OUTPUT"
              else
                echo "run_kernel=false" >> "$GITHUB_OUTPUT"
              fi
              exit 0
              ;;
            merge_group)
              echo "run_kernel=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            pull_request_review)
              if [ "${{ github.event.review.state }}" = "approved" ]; then
                echo "run_kernel=true" >> "$GITHUB_OUTPUT"
              else
                echo "run_kernel=false" >> "$GITHUB_OUTPUT"
              fi
              exit 0
              ;;
            push)
              if [ "${{ github.ref }}" = "refs/heads/main" ]; then
                echo "run_kernel=true" >> "$GITHUB_OUTPUT"
              else
                echo "run_kernel=false" >> "$GITHUB_OUTPUT"
              fi
              exit 0
              ;;
            workflow_dispatch)
              echo "run_kernel=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "unsupported Kernel CI event" >&2
              exit 1
              ;;
          esac

  kernel:
    name: kernel
    needs: kernel_scope
    if: ${{ always() && (needs.kernel_scope.result != 'success' || needs.kernel_scope.outputs.run_kernel == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Fail if applicability detection failed
        if: ${{ needs.kernel_scope.result != 'success' }}
        run: |
          echo "Kernel scope detection failed; refusing to satisfy required Kernel CI as not applicable." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show toolchain
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            node --version
            npm --version
            bun --version
            mops --version
          '

      - name: Install dependencies
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm ci
          '

      - name: Kernel package
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm --workspace neutron-kernel run package
          '

      - name: Kernel tests
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm --workspace neutron-kernel test
          '
