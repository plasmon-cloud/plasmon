name: Kernel CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "apps/plasmon/**"
  pull_request:
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect kernel-relevant changes
        id: kernel_scope
        shell: bash
        run: |
          set -euo pipefail

          # Push/main and manual runs preserve the existing full Kernel lane.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_kernel=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          kernel_relevant() {
            case "$1" in
              apps/plasmon/*|test/e2e/plasmon-golden-path.spec.ts|README.md|AGENTS.md|LICENSE|doc/*|.github/workflows/README.md)
                return 1
                ;;
              *)
                return 0
                ;;
            esac
          }

          # Keep the scope boundary deterministic: Plasmon/docs cheap-skip,
          # while Kernel/workflow changes still enter the full required lane.
          ! kernel_relevant "apps/plasmon/src/index.tsx"
          ! kernel_relevant "test/e2e/plasmon-golden-path.spec.ts"
          ! kernel_relevant "doc/testing-and-verification.md"
          kernel_relevant "apps/kernel/package.json"
          kernel_relevant ".github/workflows/kernel-ci.yml"

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base_sha" "$head_sha" > /tmp/kernel-changed-files.txt
          cat /tmp/kernel-changed-files.txt

          run_kernel=false
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if kernel_relevant "$path"; then
              run_kernel=true
              break
            fi
          done < /tmp/kernel-changed-files.txt

          echo "run_kernel=$run_kernel" >> "$GITHUB_OUTPUT"
          if [ "$run_kernel" != "true" ]; then
            echo "No kernel-relevant changes; satisfying required Kernel CI without full kernel build."
          fi

      - name: Install Nix
        if: steps.kernel_scope.outputs.run_kernel == 'true'
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show toolchain
        if: steps.kernel_scope.outputs.run_kernel == 'true'
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            node --version
            npm --version
            bun --version
            mops --version
          '

      - name: Install dependencies
        if: steps.kernel_scope.outputs.run_kernel == 'true'
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm ci
          '

      # Package first because the kernel test suite validates generated
      # artifacts produced by the normal packaging pipeline. Do not run a
      # separate build here: package already performs the build.
      - name: Kernel package
        if: steps.kernel_scope.outputs.run_kernel == 'true'
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm --workspace neutron-kernel run package
          '

      - name: Kernel tests
        if: steps.kernel_scope.outputs.run_kernel == 'true'
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm --workspace neutron-kernel test
          '
