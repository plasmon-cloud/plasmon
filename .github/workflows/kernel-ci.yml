name: Kernel CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
  pull_request_review:
    types: [submitted]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel_scope:
    name: Determine Kernel CI applicability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_kernel: ${{ steps.kernel_scope.outputs.run_kernel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify Kernel CI skip contract
        run: node test/ci/verify-kernel-ci.mjs

      - name: Detect kernel-relevant changes
        id: kernel_scope
        shell: bash
        run: |
          set -euo pipefail

          case "${{ github.event_name }}" in
            pull_request|merge_group)
              echo "run_kernel=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            pull_request_review)
              if [ "${{ github.event.review.state }}" = "approved" ]; then
                echo "run_kernel=true" >> "$GITHUB_OUTPUT"
              else
                echo "run_kernel=false" >> "$GITHUB_OUTPUT"
              fi
              exit 0
              ;;
            push)
              if [ "${{ github.ref }}" = "refs/heads/main" ]; then
                echo "run_kernel=true" >> "$GITHUB_OUTPUT"
              else
                echo "run_kernel=false" >> "$GITHUB_OUTPUT"
              fi
              exit 0
              ;;
            workflow_dispatch)
              echo "run_kernel=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "unsupported Kernel CI event" >&2
              exit 1
              ;;
          esac

  kernel:
    name: kernel
    needs: kernel_scope
    if: ${{ always() && (needs.kernel_scope.result != 'success' || needs.kernel_scope.outputs.run_kernel == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Fail if applicability detection failed
        if: ${{ needs.kernel_scope.result != 'success' }}
        run: |
          echo "Kernel scope detection failed; refusing to satisfy required Kernel CI as not applicable." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show toolchain
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            node --version
            npm --version
            bun --version
            mops --version
          '

      - name: Install dependencies
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm ci
          '

      - name: Kernel package
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm --workspace neutron-kernel run package
          '

      - name: Kernel tests
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm --workspace neutron-kernel test
          '

  approval-rerun-sync:
    name: Sync approval reruns
    needs: [kernel_scope, kernel]
    if: ${{ always() && github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.run_attempt > 1 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout trusted rerun coordinator
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - name: Propagate approval rerun to stale failed gates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node test/ci/rerun-stale-approval-gates.mjs
