name: Experiment Cmd Packaged Browser CI

on:
  push:
    branches:
      - experiment/cmd
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experiment-cmd-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and run cmd/run browser smoke
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm ci
            node test/ci/verify-playwright-gate.mjs
            npm run plasmon:local:prepare

            npm run plasmon:local:serve > /tmp/plasmon-experiment-cmd.log 2>&1 &
            server_pid=$!
            trap '\''status=$?; kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then cat /tmp/plasmon-experiment-cmd.log || true; fi; exit "$status"'\'' EXIT

            pocketic_ready=0
            for attempt in $(seq 1 180); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                echo "PocketIC serve exited before becoming ready" >&2
                cat /tmp/plasmon-experiment-cmd.log >&2 || true
                exit 1
              fi
              if grep -q "^PocketIC .* is ready$" /tmp/plasmon-experiment-cmd.log 2>/dev/null; then
                pocketic_ready=1
                break
              fi
              sleep 1
            done
            test "$pocketic_ready" -eq 1

            npm run plasmon:local:status
            npm run plasmon:local:reinstall
            NEUTRON_NDEPLOY_CONFIG=plasmon-local.ndeploy.json npm exec -- playwright test test/e2e/experiment-cmd-runtime.spec.ts
          '
