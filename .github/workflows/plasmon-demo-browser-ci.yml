name: Plasmon Demo Browser CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plasmon-demo-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-demo-browser:
    name: Packaged demo Playwright acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package, provision, and run Plasmon demo acceptance
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm ci
            npm run test:plasmon:deployment-commands
            npm run plasmon:demo:prepare

            npm run plasmon:demo:serve > /tmp/plasmon-demo-pocketic.log 2>&1 &
            server_pid=$!
            trap '\''status=$?; kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then cat /tmp/plasmon-demo-pocketic.log || true; fi; exit "$status"'\'' EXIT

            pocketic_ready=0
            for attempt in $(seq 1 180); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                echo "PocketIC demo serve exited before becoming ready" >&2
                cat /tmp/plasmon-demo-pocketic.log >&2 || true
                exit 1
              fi
              if grep -q "^PocketIC .* is ready$" /tmp/plasmon-demo-pocketic.log 2>/dev/null; then
                pocketic_ready=1
                break
              fi
              sleep 1
            done
            if [ "$pocketic_ready" -ne 1 ]; then
              echo "PocketIC demo serve did not complete startup" >&2
              cat /tmp/plasmon-demo-pocketic.log >&2 || true
              exit 1
            fi

            npm run plasmon:demo:status
            npm run plasmon:demo:reinstall
            npm run test:e2e:plasmon:demo
          '
