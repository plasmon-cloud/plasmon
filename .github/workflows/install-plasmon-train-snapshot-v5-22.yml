name: Install Plasmon Train Snapshot v5.22

on:
  pull_request:
    branches:
      - automation/train-snapshot-v5-22
    paths:
      - .github/train-helper-v5-22-bootstrap-trigger.txt

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/train-snapshot-v5-22
          fetch-depth: 1
      - name: Reconstruct exact v5.22 helper
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .github/train-helper-v5-22.parts/part-00.b64
            cat .github/train-helper-v5-22.parts/part-01.b64
            cat .github/train-helper-v5-22.parts/part-02.b64
            cat .github/train-helper-v5-22.parts/part-03.b64
            cat .github/train-helper-v5-22.corrections/part-04-00.b64
            cat .github/train-helper-v5-22.corrections/part-04-01.b64
            cat .github/train-helper-v5-22.corrections/part-04-02.b64
            cat .github/train-helper-v5-22.corrections/part-04-03-00.b64
            cat .github/train-helper-v5-22.corrections/part-04-03-01.b64
            cat .github/train-helper-v5-22.corrections/part-04-03-02.b64
            cat .github/train-helper-v5-22.corrections/part-04-03-03.b64
            cat .github/train-helper-v5-22.parts/part-05.b64
            cat .github/train-helper-v5-22.corrections/part-06-00.b64
            cat .github/train-helper-v5-22.corrections/part-06-01.b64
            cat .github/train-helper-v5-22.corrections/part-06-02.b64
            cat .github/train-helper-v5-22.corrections/part-06-03.b64
            cat .github/train-helper-v5-22.parts/part-07.b64
          } | tr -d '\r\n' | base64 -d > /tmp/plasmon-train-snapshot-v5-22.yml
          actual="$(sha256sum /tmp/plasmon-train-snapshot-v5-22.yml | awk '{print $1}')"
          expected="eff2c935b5beaf2661f39fe42ad4f168cca74523a02b23adb34ff2cbd5361bf7"
          echo "helper_sha256=$actual"
          test "$actual" = "$expected"
          cp /tmp/plasmon-train-snapshot-v5-22.yml .github/plasmon-train-snapshot-v5-22.exact.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/plasmon-train-snapshot-v5-22.exact.yml
          git commit -m 'stage exact Plasmon train snapshot v5.22 helper blob'
          git push origin HEAD:automation/train-snapshot-v5-22
