name: R2R3 test identity migration

on:
  push:
    branches:
      - cleanup/r2r3-test-identities-v2

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == '#529 migration bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cleanup/r2r3-test-identities-v2
          fetch-depth: 0

      - name: Apply behavioral identity migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          renames = {
              'test/e2e/plasmon-acceptance-107.spec.ts': 'test/e2e/plasmon-integrated-packaged-acceptance.spec.ts',
              'test/e2e/plasmon-context-menu-176.spec.ts': 'test/e2e/plasmon-file-context-menu.spec.ts',
              'test/e2e/plasmon-create-shortcut-44.spec.ts': 'test/e2e/plasmon-create-shortcut.spec.ts',
              'test/e2e/plasmon-demo-markdown-commands-114.spec.ts': 'test/e2e/plasmon-demo-markdown-commands.spec.ts',
              'test/e2e/plasmon-demo-native-app-chrome-112.spec.ts': 'test/e2e/plasmon-demo-native-app-chrome.spec.ts',
              'test/e2e/plasmon-demo-photos-expand-180.spec.ts': 'test/e2e/plasmon-demo-photos-expand.spec.ts',
              'test/e2e/plasmon-demo-text-parity-344.spec.ts': 'test/e2e/plasmon-demo-text-parity.spec.ts',
              'test/e2e/plasmon-desktop-placement-192.spec.ts': 'test/e2e/plasmon-desktop-placement.spec.ts',
              'test/e2e/plasmon-diagnostic-selection-86.spec.ts': 'test/e2e/plasmon-diagnostic-selection.spec.ts',
              'test/e2e/plasmon-drag-feedback-360.spec.ts': 'test/e2e/plasmon-drag-feedback.spec.ts',
              'test/e2e/plasmon-drag-placement-371.spec.ts': 'test/e2e/plasmon-desktop-incoming-placement.spec.ts',
              'test/e2e/plasmon-drag-preview-66.spec.ts': 'test/e2e/plasmon-drag-preview.spec.ts',
              'test/e2e/plasmon-explorer-documents-405.spec.ts': 'test/e2e/plasmon-explorer-documents.spec.ts',
              'test/e2e/plasmon-file-entry-191.spec.ts': 'test/e2e/plasmon-file-entry.spec.ts',
              'test/e2e/plasmon-hidden-default-466.spec.ts': 'test/e2e/plasmon-hidden-default.spec.ts',
              'test/e2e/plasmon-hidden-preference-110.spec.ts': 'test/e2e/plasmon-hidden-preference.spec.ts',
              'test/e2e/plasmon-hidden-visibility-429.spec.ts': 'test/e2e/plasmon-hidden-visibility.spec.ts',
              'test/e2e/plasmon-hidden-visibility-start-429.spec.ts': 'test/e2e/plasmon-hidden-visibility-start.spec.ts',
              'test/e2e/plasmon-inline-rename-361.spec.ts': 'test/e2e/plasmon-inline-rename.spec.ts',
              'test/e2e/plasmon-list-layout-173.spec.ts': 'test/e2e/plasmon-list-layout.spec.ts',
              'test/e2e/plasmon-markdown-commands-114.spec.ts': 'test/e2e/plasmon-markdown-commands.spec.ts',
              'test/e2e/plasmon-monaco-workers-89.spec.ts': 'test/e2e/plasmon-packaged-monaco-worker.spec.ts',
              'test/e2e/plasmon-operation-progress-65.spec.ts': 'test/e2e/plasmon-operation-progress.spec.ts',
              'test/e2e/plasmon-pin-affordance-109.spec.ts': 'test/e2e/plasmon-pin-affordance.spec.ts',
              'test/e2e/plasmon-recycle-bin-empty-45.spec.ts': 'test/e2e/plasmon-recycle-bin-empty.spec.ts',
              'test/e2e/plasmon-search-geometry-175.spec.ts': 'test/e2e/plasmon-search-geometry.spec.ts',
              'test/e2e/plasmon-search-resource-presentation-426.spec.ts': 'test/e2e/plasmon-search-resource-presentation.spec.ts',
              'test/e2e/plasmon-send-to-desktop-51.spec.ts': 'test/e2e/plasmon-send-to-desktop.spec.ts',
              'test/e2e/plasmon-start-inventory-428.spec.ts': 'test/e2e/plasmon-start-inventory.spec.ts',
              'test/e2e/plasmon-start-surface-194.spec.ts': 'test/e2e/plasmon-start-surface.spec.ts',
              'test/e2e/plasmon-taskbar-context-menu-402.spec.ts': 'test/e2e/plasmon-taskbar-context-menu.spec.ts',
              'test/e2e/plasmon-taskbar-presentation-72.spec.ts': 'test/e2e/plasmon-taskbar-presentation.spec.ts',
              'test/e2e/plasmon-thumbnail-aspect-93.spec.ts': 'test/e2e/plasmon-thumbnail-aspect.spec.ts',
              'test/e2e/plasmon-video-thumbnail-94.spec.ts': 'test/e2e/plasmon-video-thumbnail.spec.ts',
              'apps/plasmon/test/issue-117-window-placement.test.ts': 'apps/plasmon/test/window-placement.test.ts',
              'apps/plasmon/test/issue-25-legacy-gui2.test.ts': 'apps/plasmon/test/legacy-gui-removal.test.ts',
              'apps/plasmon/test/issue-26-legacy-platform.test.ts': 'apps/plasmon/test/legacy-platform-removal.test.ts',
              'apps/plasmon/test/issue-79-native-document-close-lifecycle.test.ts': 'apps/plasmon/test/native-document-close-lifecycle.test.ts',
              'apps/plasmon/test/issue-91-search-cap-safety.test.ts': 'apps/plasmon/test/search-cap-safety.test.ts',
              'test/e2e/fixtures/thumbnail-93-broken.png': 'test/e2e/fixtures/thumbnail-broken.png',
              'test/e2e/fixtures/thumbnail-93-landscape.svg': 'test/e2e/fixtures/thumbnail-landscape.svg',
              'test/e2e/fixtures/thumbnail-93-portrait.svg': 'test/e2e/fixtures/thumbnail-portrait.svg',
              'test/e2e/fixtures/thumbnail-93-square.svg': 'test/e2e/fixtures/thumbnail-square.svg',
              'test/e2e/fixtures/thumbnail-94.webm': 'test/e2e/fixtures/video-thumbnail.webm',
          }

          missing = [old for old in renames if not Path(old).exists()]
          collisions = [new for new in renames.values() if Path(new).exists()]
          if missing:
              raise SystemExit('Missing expected rename source(s): ' + ', '.join(missing))
          if collisions:
              raise SystemExit('Behavioral rename collision(s): ' + ', '.join(collisions))

          for old, new in renames.items():
              target = Path(new)
              target.parent.mkdir(parents=True, exist_ok=True)
              Path(old).rename(target)

          roots = [Path('test/ci'), Path('test/e2e'), Path('apps/plasmon/test'), Path('apps/plasmon/src')]
          text_suffixes = {'.js', '.jsx', '.mjs', '.cjs', '.ts', '.tsx', '.mts', '.cts', '.json', '.md', '.sh', '.yml', '.yaml'}
          text_files = {Path('package.json'), Path('apps/plasmon/package.json')}
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix.lower() in text_suffixes:
                      text_files.add(path)

          provenance_tag = re.compile(r'^@(issue|pr)-\d+$|^@r[23](?:-|$)', re.I)
          tag_array = re.compile(r'tag\s*:\s*\[([^\]]*)\]')
          quoted_tag = re.compile(r'(["\'])(@[^"\']+)\1')

          def clean_tag_array(match):
              tags = [m.group(2) for m in quoted_tag.finditer(match.group(1))]
              kept = [tag for tag in tags if not provenance_tag.match(tag)]
              return 'tag: [' + ', '.join(json.dumps(tag) for tag in kept) + ']'

          for path in sorted(text_files):
              try:
                  original = path.read_text()
              except UnicodeDecodeError:
                  continue
              text = original
              for old, new in renames.items():
                  text = text.replace(old, new)
                  text = text.replace(Path(old).name, Path(new).name)
              text = tag_array.sub(clean_tag_array, text)
              text = re.sub(r',\s*\{\s*tag:\s*\[\s*\]\s*\}', '', text)
              text = re.sub(r'(["\'`])#\d+\s+', r'\1', text)
              text = re.sub(r'(["\'`]\[demo profile\]\s+)#\d+\s+', r'\1', text)
              if path.as_posix() == 'test/e2e/plasmon-demo-game.spec.ts':
                  text = text.replace('tag: ["@quarantine"]', 'tag: ["@quarantine", "@saved-preview"]')
              if text != original:
                  path.write_text(text)

          print('Applied semantic renames:', len(renames))
          print('Residual active provenance scan:')
          residual_patterns = [
              re.compile(r'@(?:issue|pr)-\d+', re.I),
              re.compile(r'@r[23](?:-|\b)', re.I),
              re.compile(r'\bissue-\d+-', re.I),
              re.compile(r'plasmon-[A-Za-z0-9-]+-\d+\.spec\.', re.I),
          ]
          for path in sorted(text_files):
              if not path.exists():
                  continue
              try:
                  lines = path.read_text().splitlines()
              except UnicodeDecodeError:
                  continue
              for lineno, line in enumerate(lines, 1):
                  if any(pattern.search(line) for pattern in residual_patterns):
                      print(f'{path}:{lineno}:{line}')
          PY

      - name: Commit migration
        run: |
          set -euo pipefail
          git config user.name "KT"
          git config user.email "37081025+3E4B54@users.noreply.github.com"
          git add -A -- . ':!.github/workflows'
          if git diff --cached --quiet; then
            echo "No migration changes produced" >&2
            exit 1
          fi
          git commit -m "#529 Rename active tests to behavioral identities"
          git push origin HEAD:cleanup/r2r3-test-identities-v2
