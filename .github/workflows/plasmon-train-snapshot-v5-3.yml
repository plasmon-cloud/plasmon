name: Plasmon Train Snapshot v5.3

on:
  push:
    branches:
      - automation/train-snapshot-v5-3
    paths:
      - .github/workflows/plasmon-train-snapshot-v5-3.yml
      - .github/plasmon-train-snapshot-trigger-v5-3.txt

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Build compact r2 train snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: plasmon-cloud/plasmon
          TARGET: release/0.1.0-r2
          MILESTONE_TITLE: 0.1.0-r2
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          REPO = os.environ["REPO"]
          TARGET = os.environ["TARGET"]
          MILESTONE_TITLE = os.environ["MILESTONE_TITLE"]
          TOKEN = os.environ["GH_TOKEN"]
          BASE = f"https://api.github.com/repos/{REPO}"
          API_VERSION = "2026-03-10"

          def api(url_or_path):
              url = url_or_path if url_or_path.startswith("https://") else BASE + url_or_path
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": API_VERSION,
                      "User-Agent": "plasmon-train-snapshot-v5.3",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def pages(path):
              out = []
              page = 1
              sep = "&" if "?" in path else "?"
              while True:
                  rows = api(f"{path}{sep}per_page=100&page={page}")
                  if not isinstance(rows, list):
                      raise RuntimeError(f"expected list from {path}")
                  out.extend(rows)
                  if len(rows) < 100:
                      return out
                  page += 1

          def labels_of(issue):
              result = []
              for label in issue.get("labels") or []:
                  if isinstance(label, str):
                      result.append(label)
                  elif isinstance(label, dict) and label.get("name"):
                      result.append(str(label["name"]))
              return sorted(set(result))

          def field_value(issue, name):
              for item in issue.get("issue_field_values") or []:
                  if item.get("issue_field_name") == name:
                      option = item.get("single_select_option") or {}
                      return option.get("name")
              return None

          def product(labels, area, title):
              if any(label.startswith("ci:") for label in labels):
                  return False
              if str(title).startswith("[r2 CI]"):
                  return False
              if area == "Testing" and ("needs-verification" in labels or "ci:flaky" in labels):
                  return False
              return True

          milestones = pages("/milestones?state=all")
          milestone = next((m for m in milestones if m.get("title") == MILESTONE_TITLE), None)
          if milestone is None:
              raise RuntimeError(f"milestone {MILESTONE_TITLE!r} not found")
          milestone_number = int(milestone["number"])
          before = (int(milestone.get("open_issues") or 0), int(milestone.get("closed_issues") or 0))

          raw_issues = [
              item
              for item in pages(f"/issues?milestone={milestone_number}&state=all")
              if "pull_request" not in item
          ]
          if len(raw_issues) != sum(before):
              raise RuntimeError(
                  f"incomplete lane: milestone says {sum(before)} Issues "
                  f"({before[0]} open/{before[1]} closed), fetched {len(raw_issues)}"
              )

          rows = []
          by_num = {}
          for raw in raw_issues:
              number = int(raw["number"])
              open_state = str(raw.get("state", "open")).lower() == "open"
              labels = labels_of(raw)
              area = field_value(raw, "Area")
              deps = []
              dep_states = {}
              if open_state:
                  summary = raw.get("issue_dependencies_summary") or {}
                  expected = int(summary.get("blocked_by") or summary.get("total_blocked_by") or 0)
                  if expected:
                      blocked = pages(f"/issues/{number}/dependencies/blocked_by")
                      for dep in blocked:
                          dep_num = int(dep["number"])
                          deps.append(dep_num)
                          dep_states[str(dep_num)] = str(dep.get("state", "unknown"))
                      if len(set(deps)) < expected:
                          raise RuntimeError(
                              f"#{number} dependency summary says {expected}, fetched {len(set(deps))}"
                          )

              issue_type = raw.get("type")
              if isinstance(issue_type, dict):
                  issue_type = issue_type.get("name")
              row = {
                  "issue": number,
                  "title": str(raw.get("title") or ""),
                  "open": open_state,
                  "product": product(labels, area, raw.get("title") or ""),
                  "pr": None,
                  "pr_branch": None,
                  "pr_base": None,
                  "pr_created_at": None,
                  "merged": False,
                  "desire": field_value(raw, "Desire"),
                  "effort": field_value(raw, "Effort"),
                  "area": area,
                  "type": issue_type,
                  "labels": labels,
                  "dependencies": sorted(set(deps)),
                  "dependency_states": dep_states,
                  "active": False,
                  "completed": not open_state,
                  "url": raw.get("html_url") or raw.get("url"),
              }
              rows.append(row)
              by_num[number] = row

          lane_numbers = set(by_num)
          pulls = pages("/pulls?state=open")

          def mapped_issue(pr):
              body = str(pr.get("body") or "")
              title = str(pr.get("title") or "")
              candidates = []
              for pattern, source in (
                  (r"(?im)^\s*Plasmon-Issue\s*:\s*#(\d+)\b", body),
                  (r"(?i)\b(?:closes|fixes|resolves)\s+#(\d+)\b", body),
                  (r"^#(\d+)\b", title),
              ):
                  match = re.search(pattern, source)
                  if match:
                      candidates.append(int(match.group(1)))
              return next((n for n in candidates if n in lane_numbers), None)

          for pr in pulls:
              issue_num = mapped_issue(pr)
              if issue_num is None:
                  continue
              row = by_num[issue_num]
              pr_num = int(pr["number"])
              if row["pr"] is not None and row["pr"] != pr_num:
                  raise RuntimeError(f"Issue #{issue_num} maps to multiple open PRs")
              row["pr"] = pr_num
              row["pr_branch"] = (pr.get("head") or {}).get("ref")
              row["pr_base"] = (pr.get("base") or {}).get("ref")
              row["pr_created_at"] = pr.get("created_at")
              row["active"] = True

          branch_ref = api("/git/ref/heads/" + urllib.parse.quote(TARGET, safe=""))
          target_sha = ((branch_ref.get("object") or {}).get("sha"))
          if not target_sha:
              raise RuntimeError("could not resolve release target SHA")

          milestone_after = api(f"/milestones/{milestone_number}")
          after = (
              int(milestone_after.get("open_issues") or 0),
              int(milestone_after.get("closed_issues") or 0),
          )
          if after != before:
              raise RuntimeError(f"lane changed during snapshot: before={before}, after={after}")

          open_rows = [r for r in rows if r["open"]]
          missing = []
          for row in open_rows:
              absent = []
              if row["type"] not in {"Bug", "Feature", "Task"}:
                  absent.append("Type")
              if row["desire"] not in {"High", "Medium", "Low"}:
                  absent.append("Desire")
              if row["effort"] not in {"High", "Medium", "Low"}:
                  absent.append("Effort")
              if not row["area"]:
                  absent.append("Area")
              if absent:
                  missing.append(f"#{row['issue']}: {','.join(absent)}")
          if missing:
              raise RuntimeError("open r2 metadata incomplete: " + "; ".join(missing))

          captured = int(dt.datetime.now(dt.timezone.utc).timestamp())
          snapshot = {
              "schema": "plasmon-train-snapshot-v5.3",
              "lane_complete": True,
              "repo": REPO,
              "target": TARGET,
              "milestone": MILESTONE_TITLE,
              "captured_at": captured,
              "target_sha": target_sha,
              "lane_counts": {
                  "open": before[0],
                  "closed": before[1],
                  "total": sum(before),
              },
              "issues": rows,
          }
          with open("plasmon-train-snapshot-v5-3.json", "w", encoding="utf-8") as f:
              json.dump(snapshot, f, indent=2, sort_keys=False)
              f.write("\n")
          print(
              f"snapshot PASS lane={len(rows)} open={before[0]} closed={before[1]} "
              f"prs={sum(1 for r in rows if r['pr'] is not None)} target={target_sha}"
          )
          PY

      - name: Upload train snapshot
        uses: actions/upload-artifact@v4
        with:
          name: plasmon-train-snapshot-v5-3
          path: plasmon-train-snapshot-v5-3.json
          retention-days: 1
          if-no-files-found: error
