name: Plasmon Flake Probe

on:
  # The workflow must exist for every relevant PR event because
  # "Flake probe summary" is a required check. A cheap detector preserves
  # the old optimization by skipping the expensive baseline matrix when none
  # of the probe trigger paths changed. Characterization has its own selector.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      ref:
        description: Optional branch, tag, or SHA to probe; defaults to the dispatched ref
        required: false
        type: string
      iterations:
        description: Number of fresh probe iterations
        required: true
        default: '10'
        type: choice
        options:
          - '10'
          - '50'
      target:
        description: Test boundary to probe
        required: true
        default: specialist
        type: choice
        options:
          - all
          - specialist
          - exact
          - right-snap
          - left-snap
          - window-lifetime
          - monaco
          - emulatorjs
          - saved-preview
      test_file:
        description: Exact test/e2e Playwright file when target=exact
        required: false
        type: string
      test_grep:
        description: Optional exact-target Playwright grep expression; direct exact probes do not apply Specialist quarantine filtering
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: plasmon-flake-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  applicability:
    name: Determine flake probe applicability and configuration
    runs-on: ubuntu-latest
    outputs:
      applicable: ${{ steps.detect.outputs.applicable }}
      reason: ${{ steps.detect.outputs.reason }}
      primary_mode: ${{ steps.configure.outputs.primary_mode }}
      iteration_count: ${{ steps.configure.outputs.iteration_count }}
      target: ${{ steps.configure.outputs.target }}
      test_file: ${{ steps.configure.outputs.test_file }}
      test_grep: ${{ steps.configure.outputs.test_grep }}
      scope: ${{ steps.configure.outputs.scope }}
      scope_key: ${{ steps.configure.outputs.scope_key }}
      characterization_applicable: ${{ steps.characterize.outputs.applicable }}
      characterization_reason: ${{ steps.characterize.outputs.reason }}
      characterization_target: ${{ steps.characterize.outputs.target }}
      characterization_iteration_count: ${{ steps.characterize.outputs.iteration_count }}
      characterization_files_json: ${{ steps.characterize.outputs.files_json }}
      characterization_scope: ${{ steps.characterize.outputs.scope }}
      characterization_scope_key: ${{ steps.characterize.outputs.scope_key }}
      probe_matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout exact probe ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.ref || github.sha }}

      - name: Detect changed probe inputs
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p flake-probe-applicability
          : > flake-probe-applicability/changed-files.txt

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "applicable=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual-dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | sed '/^$/d' \
            | sort -u \
            | tee flake-probe-applicability/changed-files.txt

          applicable=false
          while IFS= read -r changed_file; do
            case "$changed_file" in
              apps/plasmon/src/*.test.*|\
              apps/plasmon/src/*.spec.*|\
              apps/plasmon/test/*|\
              test/e2e/*|\
              test/ci/*|\
              playwright.config.ts|\
              package.json|\
              package-lock.json|\
              flake.nix|\
              flake.lock|\
              .github/workflows/plasmon-flake-probe.yml)
                applicable=true
                break
                ;;
            esac
          done < flake-probe-applicability/changed-files.txt

          echo "applicable=$applicable" >> "$GITHUB_OUTPUT"
          if [ "$applicable" = true ]; then
            echo "reason=probe-input-changed" >> "$GITHUB_OUTPUT"
          else
            echo "reason=no-probe-input-changed" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure primary probe count and scope
        id: configure
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ITERATIONS: ${{ inputs.iterations }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_TEST_FILE: ${{ inputs.test_file }}
          INPUT_TEST_GREP: ${{ inputs.test_grep }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            primary_mode=manual
            iteration_count="${INPUT_ITERATIONS:-10}"
            target="${INPUT_TARGET:-specialist}"
            test_file="${INPUT_TEST_FILE:-}"
            test_grep="${INPUT_TEST_GREP:-}"
          else
            primary_mode=baseline
            iteration_count=10
            target=all
            test_file=""
            test_grep=""
          fi

          case "$iteration_count" in
            10|50) ;;
            *)
              echo "Unsupported probe iteration count: $iteration_count" >&2
              exit 2
              ;;
          esac

          case "$target" in
            all|specialist|right-snap|left-snap|window-lifetime|monaco|emulatorjs|saved-preview)
              if [ -n "$test_file" ] || [ -n "$test_grep" ]; then
                echo "test_file/test_grep are only valid with target=exact" >&2
                exit 2
              fi
              scope="$target"
              ;;
            exact)
              case "$test_file" in
                test/e2e/*.spec.*|test/e2e/*.test.*) ;;
                *)
                  echo "target=exact requires test/e2e/**/*.spec.* or *.test.*" >&2
                  exit 2
                  ;;
              esac
              if [ ! -f "$test_file" ]; then
                echo "Exact probe file does not exist at checked-out ref: $test_file" >&2
                exit 2
              fi
              case "$test_file$test_grep" in
                *$'\n'*|*$'\r'*)
                  echo "Exact probe scope may not contain newlines" >&2
                  exit 2
                  ;;
              esac
              scope="exact:$test_file"
              if [ -n "$test_grep" ]; then
                scope="$scope::grep=$test_grep"
              fi
              ;;
            *)
              echo "Unsupported flake-probe target: $target" >&2
              exit 2
              ;;
          esac

          scope_key="$(printf '%s' "$scope" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-//; s/-$//' | cut -c1-80)"
          if [ -z "$scope_key" ]; then
            echo "Unable to derive probe scope key" >&2
            exit 2
          fi

          {
            echo "primary_mode=$primary_mode"
            echo "iteration_count=$iteration_count"
            echo "target=$target"
            echo "test_file=$test_file"
            echo "test_grep=$test_grep"
            echo "scope=$scope"
            echo "scope_key=$scope_key"
          } >> "$GITHUB_OUTPUT"

      - name: Select automatic 50-iteration characterization scope
        id: characterize
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            cat > flake-probe-applicability/characterization.json <<'EOF'
          {
            "applicable": false,
            "reason": "not-a-pull-request",
            "target": "exact-set",
            "iteration_count": 50,
            "files": [],
            "files_json": "[]",
            "scope": "not-applicable",
            "scope_key": "not-applicable"
          }
          EOF
            {
              echo "applicable=false"
              echo "reason=not-a-pull-request"
              echo "target=exact-set"
              echo "iteration_count=50"
              echo "files_json=[]"
              echo "scope=not-applicable"
              echo "scope_key=not-applicable"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node test/ci/select-plasmon-flake-characterization.mjs \
            flake-probe-applicability/changed-files.txt \
            --github-output "$GITHUB_OUTPUT" \
            --json-file flake-probe-applicability/characterization.json

      - name: Build shared probe matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          PRIMARY_APPLICABLE: ${{ steps.detect.outputs.applicable }}
          PRIMARY_MODE: ${{ steps.configure.outputs.primary_mode }}
          PRIMARY_COUNT: ${{ steps.configure.outputs.iteration_count }}
          PRIMARY_TARGET: ${{ steps.configure.outputs.target }}
          PRIMARY_TEST_FILE: ${{ steps.configure.outputs.test_file }}
          PRIMARY_TEST_GREP: ${{ steps.configure.outputs.test_grep }}
          PRIMARY_SCOPE: ${{ steps.configure.outputs.scope }}
          PRIMARY_SCOPE_KEY: ${{ steps.configure.outputs.scope_key }}
          CHARACTERIZATION_APPLICABLE: ${{ steps.characterize.outputs.applicable }}
          CHARACTERIZATION_COUNT: ${{ steps.characterize.outputs.iteration_count }}
          CHARACTERIZATION_TARGET: ${{ steps.characterize.outputs.target }}
          CHARACTERIZATION_SCOPE: ${{ steps.characterize.outputs.scope }}
          CHARACTERIZATION_SCOPE_KEY: ${{ steps.characterize.outputs.scope_key }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const include = [];
          const addIterations = (config) => {
            for (let iteration = 1; iteration <= config.iteration_count; iteration += 1) {
              include.push({ ...config, iteration });
            }
          };

          if (process.env.PRIMARY_APPLICABLE === 'true') {
            addIterations({
              mode: process.env.PRIMARY_MODE,
              automatic_characterization: false,
              iteration_count: Number(process.env.PRIMARY_COUNT),
              target: process.env.PRIMARY_TARGET,
              test_file: process.env.PRIMARY_TEST_FILE,
              test_grep: process.env.PRIMARY_TEST_GREP,
              scope: process.env.PRIMARY_SCOPE,
              scope_key: process.env.PRIMARY_SCOPE_KEY,
            });
          }

          if (process.env.EVENT_NAME === 'pull_request' && process.env.CHARACTERIZATION_APPLICABLE === 'true') {
            addIterations({
              mode: 'characterization',
              automatic_characterization: true,
              iteration_count: Number(process.env.CHARACTERIZATION_COUNT),
              target: process.env.CHARACTERIZATION_TARGET,
              test_file: '',
              test_grep: '',
              scope: process.env.CHARACTERIZATION_SCOPE,
              scope_key: process.env.CHARACTERIZATION_SCOPE_KEY,
            });
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          NODE

      - name: Upload applicability and characterization evidence
        uses: actions/upload-artifact@v4
        with:
          name: flake-probe-applicability-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: flake-probe-applicability
          if-no-files-found: error
          retention-days: 7

  probe:
    if: needs.applicability.outputs.applicable == 'true' || needs.applicability.outputs.characterization_applicable == 'true'
    needs: applicability
    name: Flake ${{ matrix.mode }} ${{ matrix.scope }} iteration ${{ matrix.iteration }}/${{ matrix.iteration_count }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.mode == 'characterization' }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.applicability.outputs.probe_matrix) }}

    env:
      PROBE_MODE: ${{ matrix.mode }}
      PROBE_TARGET: ${{ matrix.target }}
      PROBE_TEST_FILE: ${{ matrix.test_file }}
      PROBE_TEST_GREP: ${{ matrix.test_grep }}
      PROBE_TEST_FILES_JSON: ${{ matrix.automatic_characterization && needs.applicability.outputs.characterization_files_json || '[]' }}
      PROBE_SCOPE: ${{ matrix.scope }}
      PROBE_ITERATION_COUNT: ${{ matrix.iteration_count }}

    steps:
      - name: Checkout exact probe ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.ref || github.sha }}

      - name: Record exact probe identity
        run: |
          set -euxo pipefail
          echo "PROBE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "mode=$PROBE_MODE"
          echo "iteration=${{ matrix.iteration }}/$PROBE_ITERATION_COUNT"
          echo "run_id=${{ github.run_id }}"
          echo "run_number=${{ github.run_number }}"
          echo "run_attempt=${{ github.run_attempt }}"
          echo "target=$PROBE_TARGET"
          echo "scope=$PROBE_SCOPE"
          git rev-parse HEAD

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fresh Plasmon probe iteration
        id: probe
        run: |
          set -o pipefail
          nix develop --command bash -lc '
            set -euxo pipefail
            bash test/ci/run-plasmon-flake-probe.sh "$PROBE_TARGET" "$PROBE_TEST_FILE" "$PROBE_TEST_GREP" "$PROBE_TEST_FILES_JSON"
          ' 2>&1 | tee flake-probe-output.log

      - name: Record probe iteration result
        if: always()
        run: |
          set -u
          mkdir -p flake-probe-result
          {
            echo "run_id=${{ github.run_id }}"
            echo "run_number=${{ github.run_number }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "mode=${PROBE_MODE:-unknown}"
            echo "iteration=${{ matrix.iteration }}"
            echo "iteration_count=${PROBE_ITERATION_COUNT:-unknown}"
            echo "outcome=${{ steps.probe.outcome }}"
            echo "sha=${PROBE_SHA:-unknown}"
            echo "target=${PROBE_TARGET:-unknown}"
            echo "scope=${PROBE_SCOPE:-unknown}"
            echo "test_file=${PROBE_TEST_FILE:-}"
            echo "test_grep=${PROBE_TEST_GREP:-}"
            echo "test_files_json=${PROBE_TEST_FILES_JSON:-[]}"
          } > flake-probe-result/result.txt

      - name: Upload probe iteration result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-probe-${{ matrix.mode }}-${{ matrix.iteration_count }}-${{ matrix.scope_key }}-iteration-result-${{ github.run_id }}-attempt-${{ github.run_attempt }}-${{ matrix.iteration }}
          path: flake-probe-result/result.txt
          if-no-files-found: error
          retention-days: 7

      - name: Collect failed-probe-iteration diagnostics
        if: always() && steps.probe.outcome != 'success'
        run: |
          set -u
          mkdir -p flake-probe-diagnostics
          cp flake-probe-result/result.txt flake-probe-diagnostics/result.txt 2>/dev/null || true
          cp flake-probe-output.log flake-probe-diagnostics/probe-output.log 2>/dev/null || true
          cp /tmp/plasmon-pocketic.log flake-probe-diagnostics/pocketic.log 2>/dev/null || true
          if [ -d playwright-report ]; then
            cp -R playwright-report flake-probe-diagnostics/playwright-report
          fi
          if [ -d test-results ]; then
            cp -R test-results flake-probe-diagnostics/test-results
          fi

      - name: Upload failed-probe-iteration diagnostics
        if: always() && steps.probe.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: flake-probe-${{ matrix.mode }}-${{ matrix.iteration_count }}-${{ matrix.scope_key }}-iteration-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}-${{ matrix.iteration }}
          path: flake-probe-diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Report observed probe failure
        if: always() && steps.probe.outcome != 'success'
        run: |
          set -u
          diagnostic_artifact="flake-probe-${PROBE_MODE:-unknown}-${PROBE_ITERATION_COUNT:-unknown}-${{ matrix.scope_key }}-iteration-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}-${{ matrix.iteration }}"
          context_file="$(find test-results -name error-context.md -type f -print -quit 2>/dev/null || true)"

          {
            echo "## Plasmon flake probe iteration failure"
            echo
            echo "- Probe mode: \`${PROBE_MODE:-unknown}\`"
            echo "- Probe iteration: ${{ matrix.iteration }}/${PROBE_ITERATION_COUNT:-unknown}"
            echo "- Workflow run_number: ${{ github.run_number }}"
            echo "- Workflow run_attempt: ${{ github.run_attempt }}"
            echo "- Exact SHA: \`${PROBE_SHA:-unknown}\`"
            echo "- Target: \`${PROBE_TARGET:-unknown}\`"
            echo "- Scope: \`${PROBE_SCOPE:-unknown}\`"
            echo "- Actions run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Diagnostic artifact: \`$diagnostic_artifact\`"
            echo
            echo "The failing command is the \`Run fresh Plasmon probe iteration\` step above; expand it for the original stdout/stderr."
            echo
            if [ -n "$context_file" ]; then
              echo "### First Playwright error context"
              echo
              sed -n '1,120p' "$context_file"
            else
              echo "No Playwright error-context.md was produced. The failure may have occurred before Playwright; use the failed probe step for the original error."
            fi
            echo
            echo "The diagnostic artifact also includes \`probe-output.log\` when probe output was produced."
          } | tee -a "$GITHUB_STEP_SUMMARY"

  summary:
    if: ${{ always() && (needs.applicability.result != 'success' || needs.applicability.outputs.applicable == 'true') }}
    name: Flake probe summary
    needs: [applicability, probe]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful applicability detection
        env:
          APPLICABILITY_RESULT: ${{ needs.applicability.result }}
        run: |
          set -euo pipefail
          if [ "$APPLICABILITY_RESULT" != success ]; then
            echo "Flake probe applicability detection did not complete successfully: $APPLICABILITY_RESULT" >&2
            exit 1
          fi

      - name: Checkout exact probe ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.ref || github.sha }}

      - name: Download applicability evidence from available run attempts
        uses: actions/download-artifact@v4
        with:
          pattern: flake-probe-applicability-${{ github.run_id }}-attempt-*
          path: flake-probe-applicability
          merge-multiple: true

      - name: Download primary probe iteration results across run attempts
        uses: actions/download-artifact@v4
        with:
          pattern: flake-probe-${{ needs.applicability.outputs.primary_mode }}-${{ needs.applicability.outputs.iteration_count }}-${{ needs.applicability.outputs.scope_key }}-iteration-result-${{ github.run_id }}-attempt-*-*
          path: flake-probe-results

      - name: Detect failed primary probe iterations
        id: primary_results
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = 'flake-probe-results';
          const files = [];
          const visit = (directory) => {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const next = path.join(directory, entry.name);
              if (entry.isDirectory()) visit(next);
              else if (entry.name === 'result.txt') files.push(next);
            }
          };
          visit(root);
          const failed = files.some((file) => !fs.readFileSync(file, 'utf8').includes('outcome=success'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `failed=${failed}\n`);
          NODE

      - name: Download failed primary probe diagnostics across run attempts
        if: steps.primary_results.outputs.failed == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: flake-probe-${{ needs.applicability.outputs.primary_mode }}-${{ needs.applicability.outputs.iteration_count }}-${{ needs.applicability.outputs.scope_key }}-iteration-diagnostics-${{ github.run_id }}-attempt-*-*
          path: flake-probe-diagnostics

      - name: Summarize exact-head baseline or manual stability
        run: |
          set -o pipefail
          mkdir -p flake-probe-diagnostics flake-probe-summary
          node test/ci/summarize-flake-probe.mjs \
            flake-probe-results \
            flake-probe-diagnostics \
            flake-probe-applicability/changed-files.txt \
            --json-file flake-probe-summary/summary.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload baseline/manual evidence packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-summary-${{ needs.applicability.outputs.primary_mode }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: flake-probe-summary/summary.json
          if-no-files-found: ignore
          retention-days: 7

  characterization_summary:
    if: ${{ always() && github.event_name == 'pull_request' && needs.applicability.result == 'success' }}
    name: Flake characterization summary
    needs: [applicability, probe]
    runs-on: ubuntu-latest
    steps:
      - name: Report non-applicable characterization
        if: needs.applicability.outputs.characterization_applicable != 'true'
        env:
          CHARACTERIZATION_REASON: ${{ needs.applicability.outputs.characterization_reason }}
        run: |
          {
            echo "## Plasmon 50-iteration characterization probe"
            echo
            echo "No automatic characterization was selected for this PR head."
            echo
            echo "- Selection reason: \`${CHARACTERIZATION_REASON:-unknown}\`"
            echo "- The normal 10-iteration baseline remains a separate evidence packet/check in \`Flake probe summary\`."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Checkout exact characterization ref
        if: needs.applicability.outputs.characterization_applicable == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download characterization applicability evidence from available run attempts
        if: needs.applicability.outputs.characterization_applicable == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: flake-probe-applicability-${{ github.run_id }}-attempt-*
          path: flake-probe-applicability
          merge-multiple: true

      - name: Download characterization probe iteration results across run attempts
        if: needs.applicability.outputs.characterization_applicable == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: flake-probe-characterization-${{ needs.applicability.outputs.characterization_iteration_count }}-${{ needs.applicability.outputs.characterization_scope_key }}-iteration-result-${{ github.run_id }}-attempt-*-*
          path: flake-characterization-results

      - name: Detect failed characterization probe iterations
        if: needs.applicability.outputs.characterization_applicable == 'true'
        id: characterization_results
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = 'flake-characterization-results';
          const files = [];
          const visit = (directory) => {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const next = path.join(directory, entry.name);
              if (entry.isDirectory()) visit(next);
              else if (entry.name === 'result.txt') files.push(next);
            }
          };
          visit(root);
          const failed = files.some((file) => !fs.readFileSync(file, 'utf8').includes('outcome=success'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `failed=${failed}\n`);
          NODE

      - name: Download failed characterization diagnostics across run attempts
        if: needs.applicability.outputs.characterization_applicable == 'true' && steps.characterization_results.outputs.failed == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: flake-probe-characterization-${{ needs.applicability.outputs.characterization_iteration_count }}-${{ needs.applicability.outputs.characterization_scope_key }}-iteration-diagnostics-${{ github.run_id }}-attempt-*-*
          path: flake-characterization-diagnostics

      - name: Summarize exact-head 50-iteration characterization evidence
        if: needs.applicability.outputs.characterization_applicable == 'true'
        run: |
          set -o pipefail
          mkdir -p flake-characterization-diagnostics flake-characterization-summary
          node test/ci/summarize-flake-probe.mjs \
            flake-characterization-results \
            flake-characterization-diagnostics \
            flake-probe-applicability/changed-files.txt \
            --json-file flake-characterization-summary/summary.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload characterization evidence packet
        if: always() && needs.applicability.outputs.characterization_applicable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flake-summary-characterization-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: flake-characterization-summary/summary.json
          if-no-files-found: ignore
          retention-days: 7
