name: Experiment Cmd Merge R3

on:
  push:
    branches:
      - experiment/cmd
    paths:
      - .github/workflows/experiment-cmd-merge-r3.yml

permissions:
  contents: write

jobs:
  inspect-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: experiment/cmd
          fetch-depth: 0
      - name: Inspect merge conflicts
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin release/0.1.0-r3
          set +e
          git merge --no-commit --no-ff origin/release/0.1.0-r3
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo 'CONFLICT_FILES_BEGIN'
            git diff --name-only --diff-filter=U
            echo 'CONFLICT_FILES_END'
            exit "$status"
          fi
          echo 'Merge is conflict-free.'
          git merge --abort
