name: Experiment Cmd Merge R3

on:
  push:
    branches:
      - experiment/cmd
    paths:
      - .github/workflows/experiment-cmd-merge-r3.yml

permissions:
  contents: write

jobs:
  inspect-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: experiment/cmd
          fetch-depth: 0
      - name: Inspect merge conflicts
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin release/0.1.0-r3
          set +e
          git merge --no-commit --no-ff origin/release/0.1.0-r3
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git diff --name-only --diff-filter=U > /tmp/experiment-cmd-r3-conflicts.txt
            git merge --abort
            cp /tmp/experiment-cmd-r3-conflicts.txt .github/experiment-cmd-r3-conflicts.txt
            git add .github/experiment-cmd-r3-conflicts.txt
            git commit -m 'CI: record R3 merge conflicts for cmd experiment'
            git push origin HEAD:experiment/cmd
            exit 0
          fi
          git merge --abort
          printf '%s\n' 'NO_CONFLICTS' > .github/experiment-cmd-r3-conflicts.txt
          git add .github/experiment-cmd-r3-conflicts.txt
          git commit -m 'CI: record conflict-free R3 merge for cmd experiment'
          git push origin HEAD:experiment/cmd
