name: Bootstrap Plasmon Train Snapshot v5.24

on:
  push:
    branches:
      - automation/train-snapshot-v5-24
    paths:
      - .github/workflows/plasmon-train-snapshot-v5-24.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/train-snapshot-v5-24
      - name: Install exact v5.24 helper
        shell: bash
        run: |
          set -euo pipefail
          cat .github/train-bootstrap/v5-24/part-* > /tmp/plasmon-train-snapshot-v5-24.yml
          test "$(git hash-object /tmp/plasmon-train-snapshot-v5-24.yml)" = "b75702931938ebdbbd39dffac56791872585d7cf"
          cp /tmp/plasmon-train-snapshot-v5-24.yml .github/workflows/plasmon-train-snapshot-v5-24.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/plasmon-train-snapshot-v5-24.yml
          git commit -m 'install exact train snapshot v5.24 helper'
          git push origin HEAD:automation/train-snapshot-v5-24
