name: R2R3 #531 bootstrap repair

on:
  push:
    branches:
      - cleanup/r2r3-quarantine-model-v2
    paths:
      - .github/workflows/r2r3-531-bootstrap-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/r2r3-quarantine-model-v2
          fetch-depth: 0
      - name: Repair bootstrap and self-remove
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          target = Path('.github/workflows/r2r3-531-review-fix.yml')
          text = target.read_text()
          old = "'''.replace(/^          /gm, ''))"
          if text.count(old) != 1:
              raise SystemExit(f'expected one broken dedent expression, found {text.count(old)}')
          target.write_text(text.replace(old, "''')"))
          Path('.github/workflows/r2r3-531-bootstrap-repair.yml').unlink()
          PY
          git config user.name "plasmon-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "#531 Repair review-fix bootstrap"
          git push origin HEAD:cleanup/r2r3-quarantine-model-v2
