name: Issue 187 Visual Spike

on:
  pull_request:
    paths:
      - "test/e2e/plasmon-visual-spike.spec.ts"
      - "test/e2e/plasmon-browser-health.ts"
      - "package.json"
      - ".github/workflows/issue-187-visual-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-187-visual-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-spike:
    name: Focused screenshot feasibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run focused visual spike
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm ci
            npm run plasmon:demo:prepare
            npm run plasmon:demo:serve > /tmp/plasmon-visual-spike.log 2>&1 &
            server_pid=$!
            trap '\''status=$?; kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then cat /tmp/plasmon-visual-spike.log || true; fi; exit "$status"'\'' EXIT
            pocketic_ready=0
            for attempt in $(seq 1 180); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                cat /tmp/plasmon-visual-spike.log >&2 || true
                exit 1
              fi
              if grep -q "^PocketIC .* is ready$" /tmp/plasmon-visual-spike.log 2>/dev/null; then
                pocketic_ready=1
                break
              fi
              sleep 1
            done
            test "$pocketic_ready" -eq 1
            npm run plasmon:demo:reinstall
            npm run test:e2e:plasmon:visual-spike
          '
      - name: Upload visual spike artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-187-visual-spike
          path: test-results/
          if-no-files-found: ignore
