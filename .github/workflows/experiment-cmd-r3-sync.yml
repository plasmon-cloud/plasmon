name: Experiment Cmd R3 Sync

on:
  push:
    branches:
      - experiment/cmd
    paths:
      - .github/workflows/experiment-cmd-r3-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: experiment/cmd
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Merge current R3 and resolve bounded scripting conflicts
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin release/0.1.0-r3

          set +e
          git merge --no-commit --no-ff origin/release/0.1.0-r3
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            printf 'Conflicts:\n%s\n' "${conflicts[*]}"
            expected=(
              "apps/plasmon/build.ts"
              "apps/plasmon/monacoWorkerTransport.ts"
            )
            if [ "${conflicts[*]}" != "${expected[*]}" ]; then
              echo "Unexpected R3 merge conflict set; refusing automatic resolution."
              exit 1
            fi

            # R3 owns package-profile policy. Preserve it, then keep the one
            # scripting requirement: the default/slim product must package the
            # TypeScript worker used by .run compilation and Monaco language help.
            git checkout --theirs -- apps/plasmon/build.ts apps/plasmon/monacoWorkerTransport.ts
            python3 - <<'PY'
          from pathlib import Path

          build = Path('apps/plasmon/build.ts')
          text = build.read_text()
          old = '? monacoEntryPoints.filter(({ out }) => out.endsWith("/editor.worker"))'
          new = '? monacoEntryPoints.filter(({ out }) => out.endsWith("/editor.worker") || out.endsWith("/ts.worker"))'
          if old not in text:
              raise SystemExit('R3 build.ts slim Monaco filter changed; refusing blind resolution')
          build.write_text(text.replace(old, new, 1))

          transport = Path('apps/plasmon/monacoWorkerTransport.ts')
          text = transport.read_text()
          old = '? ALL_MONACO_WORKERS.slice(0, 1)'
          new = '? ALL_MONACO_WORKERS.filter(([filename]) => filename === "editor.worker.js" || filename === "ts.worker.js")'
          if old not in text:
              raise SystemExit('R3 Monaco worker policy changed; refusing blind resolution')
          transport.write_text(text.replace(old, new, 1))
          PY
            git add apps/plasmon/build.ts apps/plasmon/monacoWorkerTransport.ts
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          git rm .github/workflows/experiment-cmd-r3-sync.yml

      - name: Install dependencies
        run: npm ci

      - name: Full Plasmon deterministic suite
        run: npm --workspace neutron-plasmon test

      - name: Build default slim profile
        env:
          PLASMON_PACKAGE_PROFILE: slim
        run: npm --workspace neutron-plasmon run build

      - name: Verify scripting compiler workers survive R3 package policy
        run: |
          set -euxo pipefail
          test -f 'apps/plasmon/dist/web/System/Program Files/MonacoEditor/editor.worker.js'
          test -f 'apps/plasmon/dist/web/System/Program Files/MonacoEditor/ts.worker.js'
          test -f 'apps/plasmon/dist/web/runtime/monaco/editor.worker.js'
          test -f 'apps/plasmon/dist/web/runtime/monaco/ts.worker.js'

      - name: Merge hygiene
        run: |
          set -euxo pipefail
          git diff --check
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Commit and push R3 sync
        run: |
          set -euxo pipefail
          git commit -m "Merge release/0.1.0-r3 into cmd experiment"
          git push origin HEAD:experiment/cmd
