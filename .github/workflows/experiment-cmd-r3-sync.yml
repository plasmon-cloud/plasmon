name: Experiment Cmd R3 Sync

on:
  push:
    branches:
      - experiment/cmd
    paths:
      - .github/workflows/experiment-cmd-r3-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/cmd
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch current R3
        run: git fetch origin release/0.1.0-r3
      - name: Inspect merge
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff origin/release/0.1.0-r3
          status=$?
          if [ "$status" -ne 0 ]; then
            echo 'R3 merge conflicts:'
            git diff --name-only --diff-filter=U
            exit "$status"
          fi
          echo 'R3 merges cleanly.'
          git merge --abort
