name: R2R3 quarantine marker migration

on:
  pull_request:
    branches: [release/0.1.0-r2r3]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'cleanup/r2r3-testing-ci-provenance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rename non-workflow executable quarantine marker references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          files=(
            test/e2e/plasmon-demo-game.spec.ts
            test/ci/run-plasmon-specialist.mjs
            test/ci/run-plasmon-flake-probe.sh
            test/ci/select-plasmon-flake-characterization.mjs
            test/ci/verify-flake-probe.mjs
            test/ci/verify-labeled-flake-probe.mjs
            test/ci/verify-plasmon-test-inventory.mjs
            test/ci/verify-playwright-packet-lifecycle.mjs
          )
          for file in "${files[@]}"; do
            grep -q '@r2-quarantine' "$file" || {
              echo "Expected active marker reference missing from $file" >&2
              exit 1
            }
            sed -i 's/@r2-quarantine/@quarantine/g' "$file"
          done
          test "$(git grep -n 'tag:.*@quarantine' -- 'test/e2e/*.spec.ts' | wc -l | tr -d ' ')" = 1
          git grep -n 'saved js-dos resource publishes a blob-backed preview after save' test/e2e/plasmon-demo-game.spec.ts
          git grep -n -- '--grep-invert @quarantine' test/ci/run-plasmon-specialist.mjs test/ci/run-plasmon-flake-probe.sh
          # Workflow YAML is intentionally left for the GitHub connector permission boundary.
          # Validate the non-workflow executable graph here; full deterministic verification
          # reruns after the workflow YAML is updated on the final head.
          git add "${files[@]}"
          git commit -m '#539 Rename non-workflow quarantine marker references'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
