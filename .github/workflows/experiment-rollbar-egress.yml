name: Experimental Rollbar Packaged Egress

on:
  pull_request:
    paths:
      - apps/plasmon/**
      - test/e2e/plasmon-rollbar-egress-experiment.spec.ts
      - package-lock.json
      - .github/workflows/experiment-rollbar-egress.yml

permissions:
  contents: read

jobs:
  egress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Package, install, launch, and probe Rollbar from Plasmon iframe
        env:
          EXPERIMENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            export PLASMON_PACKAGE_PROFILE=full
            export PLASMON_REMOTE_INCIDENT_EXPERIMENT=1
            export PLASMON_ROLLBAR_CLIENT_TOKEN=ci-packaged-egress-token
            export PLASMON_BUILD_SHA="$EXPERIMENT_SHA"
            npm ci
            npm run plasmon:local:prepare
            npm run plasmon:local:serve > /tmp/plasmon-rollbar-egress-pocketic.log 2>&1 &
            server_pid=$!
            trap '\''status=$?; kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then cat /tmp/plasmon-rollbar-egress-pocketic.log || true; fi; exit "$status"'\'' EXIT

            pocketic_ready=0
            for attempt in $(seq 1 180); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                echo "PocketIC serve exited before becoming ready" >&2
                cat /tmp/plasmon-rollbar-egress-pocketic.log >&2 || true
                exit 1
              fi
              if grep -q "^PocketIC .* is ready$" /tmp/plasmon-rollbar-egress-pocketic.log 2>/dev/null; then
                pocketic_ready=1
                break
              fi
              sleep 1
            done
            test "$pocketic_ready" -eq 1

            npm run plasmon:local:status
            npm run plasmon:local:reinstall
            npx playwright test test/e2e/plasmon-rollbar-egress-experiment.spec.ts
          '
