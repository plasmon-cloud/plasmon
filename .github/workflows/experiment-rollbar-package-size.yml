name: Experimental Rollbar Package Size

on:
  pull_request:
    paths:
      - apps/plasmon/**
      - package-lock.json
      - .github/workflows/experiment-rollbar-package-size.yml

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPERIMENT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout experiment head
        uses: actions/checkout@v6
        with:
          path: head
          fetch-depth: 1
      - name: Checkout exact PR base
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 1
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install exact dependency graphs
        run: |
          (cd base && nix develop --command npm ci)
          (cd head && nix develop --command npm ci)
      - name: Package and compare exact archives
        shell: bash
        run: |
          set -euo pipefail
          archive_path() {
            echo "$1/apps/plasmon/plasmon.v0.1.0.neutron"
          }
          package_size() {
            local tree="$1"
            local profile="$2"
            local remote="$3"
            local log="/tmp/$tree-$profile-$remote.log"
            local command="PLASMON_PACKAGE_PROFILE=$profile npm --workspace neutron-plasmon run package"
            if [[ "$remote" == "remote" ]]; then
              command="PLASMON_PACKAGE_PROFILE=$profile PLASMON_REMOTE_INCIDENT_EXPERIMENT=1 PLASMON_ROLLBAR_CLIENT_TOKEN=ci-package-probe-token PLASMON_BUILD_SHA=$EXPERIMENT_SHA npm --workspace neutron-plasmon run package"
            fi
            if ! (cd "$tree" && nix develop --command bash -lc "$command" >"$log" 2>&1); then
              cat "$log" >&2
              return 1
            fi
            local archive
            archive=$(archive_path "$tree")
            if [[ ! -f "$archive" ]]; then
              cat "$log" >&2
              echo "missing expected archive: $archive" >&2
              return 1
            fi
            stat -c%s "$archive"
          }

          BASE_SLIM=$(package_size base slim local)
          cp "$(archive_path base)" /tmp/base-slim.neutron
          rm -f "$(archive_path base)"
          HEAD_SLIM=$(package_size head slim local)
          cp "$(archive_path head)" /tmp/head-slim.neutron
          rm -rf /tmp/head-slim-web
          cp -a head/apps/plasmon/dist/web /tmp/head-slim-web
          rm -f "$(archive_path head)"
          BASE_FULL=$(package_size base full local)
          rm -f "$(archive_path base)"
          HEAD_FULL_REMOTE=$(package_size head full remote)
          rm -f "$(archive_path head)"
          DELTA_SLIM=$((HEAD_SLIM - BASE_SLIM))
          DELTA_FULL_REMOTE=$((HEAD_FULL_REMOTE - BASE_FULL))

          {
            echo '## Rollbar experiment package-size evidence'
            echo
            echo '| Build | Base bytes | Experiment bytes | Delta bytes |'
            echo '| --- | ---: | ---: | ---: |'
            echo "| slim, local diagnostics only | $BASE_SLIM | $HEAD_SLIM | $DELTA_SLIM |"
            echo "| full, remote experiment enabled | $BASE_FULL | $HEAD_FULL_REMOTE | $DELTA_FULL_REMOTE |"
            echo
            echo "Slim contract: normal slim archive must remain strictly < 1900000 bytes and contain no remote-reporting payload."
            echo "Full remote delta is informational only."
          } | tee -a "$GITHUB_STEP_SUMMARY"

          {
            echo "BASE_SLIM=$BASE_SLIM"
            echo "HEAD_SLIM=$HEAD_SLIM"
            echo "DELTA_SLIM=$DELTA_SLIM"
            echo "BASE_FULL=$BASE_FULL"
            echo "HEAD_FULL_REMOTE=$HEAD_FULL_REMOTE"
            echo "DELTA_FULL_REMOTE=$DELTA_FULL_REMOTE"
          } >> "$GITHUB_ENV"

          echo "PLASMON_PACKAGE_BASE_SLIM=$BASE_SLIM"
          echo "PLASMON_PACKAGE_HEAD_SLIM=$HEAD_SLIM"
          echo "PLASMON_PACKAGE_DELTA_SLIM=$DELTA_SLIM"
          echo "PLASMON_PACKAGE_BASE_FULL=$BASE_FULL"
          echo "PLASMON_PACKAGE_HEAD_FULL_REMOTE=$HEAD_FULL_REMOTE"
          echo "PLASMON_PACKAGE_DELTA_FULL_REMOTE=$DELTA_FULL_REMOTE"

      - name: Prove slim rejects remote reporting
        working-directory: head
        shell: bash
        run: |
          set -euo pipefail
          if nix develop --command bash -lc "PLASMON_PACKAGE_PROFILE=slim PLASMON_REMOTE_INCIDENT_EXPERIMENT=1 PLASMON_ROLLBAR_CLIENT_TOKEN=ci-package-probe-token PLASMON_BUILD_SHA=$EXPERIMENT_SHA npm --workspace neutron-plasmon run package" >/tmp/slim-remote.log 2>&1; then
            echo "Slim unexpectedly accepted PLASMON_REMOTE_INCIDENT_EXPERIMENT=1" >&2
            exit 1
          fi
          cat /tmp/slim-remote.log
          grep -q "Slim package profile excludes remote incident reporting" /tmp/slim-remote.log

      - name: Prove slim artifact contains no remote payload
        shell: bash
        run: |
          set -euo pipefail
          cmp /tmp/base-slim.neutron /tmp/head-slim.neutron
          BASE_SHA=$(sha256sum /tmp/base-slim.neutron | cut -d' ' -f1)
          HEAD_SHA=$(sha256sum /tmp/head-slim.neutron | cut -d' ' -f1)
          echo "Canonical #667 slim SHA-256: $BASE_SHA"
          echo "Experiment slim SHA-256:      $HEAD_SHA"
          test "$BASE_SHA" = "$HEAD_SHA"

          if grep -R -a -E -n \
            'RollbarRemoteIncidentSink|RemoteIncidentSink|plasmon\.remote-incident\.v1|remote\.synthetic\.failed|api\.rollbar\.com|post_client_item' \
            /tmp/head-slim-web; then
            echo "Slim web payload contains #674 remote-reporting runtime markers" >&2
            exit 1
          fi
          echo "Slim archive is byte-identical to canonical #667 and its built web payload contains no #674/Rollbar runtime markers"

      - name: Verify explicit source-map policy stays outside full package input
        working-directory: head
        env:
          PLASMON_PACKAGE_PROFILE: full
          PLASMON_REMOTE_SOURCE_MAPS: "1"
          PLASMON_REMOTE_SOURCES_CONTENT: include
          PLASMON_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm --workspace neutron-plasmon run build
            test -s apps/plasmon/.remote-sourcemaps/main.js.map
            test ! -e apps/plasmon/dist/web/main.js.map
            grep -q '"'"'"sourcesContent"'"'"' apps/plasmon/.remote-sourcemaps/main.js.map
            ! grep -q '"'"'sourceMappingURL='"'"' apps/plasmon/dist/web/main.js
          '

      - name: Enforce slim package contract
        shell: bash
        run: |
          echo "Measured normal slim archive: $HEAD_SLIM bytes"
          echo "Required: strictly less than 1900000 bytes"
          test "$HEAD_SLIM" -lt 1900000
