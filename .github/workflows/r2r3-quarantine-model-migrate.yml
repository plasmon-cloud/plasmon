name: R2R3 quarantine model migration

on:
  pull_request:
    branches: [cleanup/r2r3-testing-ci-provenance]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'cleanup/r2r3-quarantine-model'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Migrate executable quarantine authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          python3 - <<'PY'
          from pathlib import Path
          import re

          executable_marker_files = [
              '.github/workflows/plasmon-browser-ci.yml',
              '.github/workflows/plasmon-flake-probe-label.yml',
              'test/ci/run-plasmon-specialist.mjs',
              'test/ci/run-plasmon-flake-probe.sh',
              'test/ci/select-plasmon-flake-characterization.mjs',
              'test/ci/verify-plasmon-test-inventory.mjs',
              'test/ci/verify-flake-probe.mjs',
              'test/ci/verify-labeled-flake-probe.mjs',
              'test/e2e/plasmon-demo-game.spec.ts',
          ]
          for name in executable_marker_files:
              path = Path(name)
              text = path.read_text()
              text = text.replace('@r2-quarantine', '@quarantine')
              path.write_text(text)

          # Specialist obtains the marker from the inventory authority.
          path = Path('test/ci/run-plasmon-specialist.mjs')
          text = path.read_text()
          anchor = "} from './plasmon-test-inventory.mjs';\n"
          if "from './plasmon-quarantine.mjs'" not in text:
              assert text.count(anchor) == 1
              text = text.replace(anchor, anchor + "import { quarantineMarker } from './plasmon-quarantine.mjs';\n", 1)
          assert text.count("    '@quarantine',") == 1
          text = text.replace("    '@quarantine',", "    quarantineMarker,", 1)
          path.write_text(text)

          # Targeted Flake Probe obtains the same marker dynamically.
          path = Path('test/ci/run-plasmon-flake-probe.sh')
          text = path.read_text()
          anchor = 'test_files_json="${PROBE_TEST_FILES_JSON:-[]}"\n'
          marker_line = 'quarantine_marker="$(node test/ci/plasmon-quarantine.mjs --marker)"\n'
          if marker_line not in text:
              assert text.count(anchor) == 1
              text = text.replace(anchor, anchor + marker_line, 1)
          assert text.count('--grep-invert @quarantine') == 1
          text = text.replace('--grep-invert @quarantine', '--grep-invert "$quarantine_marker"', 1)
          path.write_text(text)

          # Demo CI also reads the inventory marker; it keeps the same exact file set here.
          path = Path('.github/workflows/plasmon-browser-ci.yml')
          text = path.read_text()
          needle = '            NEUTRON_NDEPLOY_CONFIG=plasmon.ndeploy.json npx --no-install playwright test --workers=1 --retries=0 --grep-invert @quarantine \\\n'
          replacement = '            quarantine_marker="$(node test/ci/plasmon-quarantine.mjs --marker)"\n' + needle.replace('@quarantine', '"$quarantine_marker"')
          assert text.count(needle) == 1
          text = text.replace(needle, replacement, 1)
          path.write_text(text)

          # Automatic characterization excludes a file only when every test in it is active quarantine debt.
          path = Path('test/ci/select-plasmon-flake-characterization.mjs')
          text = path.read_text()
          anchor = '} from "./plasmon-test-inventory.mjs";\n'
          if 'from "./plasmon-quarantine.mjs"' not in text:
              assert text.count(anchor) == 1
              text = text.replace(anchor, anchor + 'import { isFullyQuarantinedSource } from "./plasmon-quarantine.mjs";\n', 1)
          old = '''function isQuarantinedAcceptance(path, sources) {\n  return (sources.get(path) ?? "").includes("@quarantine");\n}\n'''
          new = '''function isFullyQuarantinedAcceptance(path, sources) {\n  return isFullyQuarantinedSource(path, sources.get(path) ?? "");\n}\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1).replace('isQuarantinedAcceptance(', 'isFullyQuarantinedAcceptance(')
          path.write_text(text)

          # Inventory verifier derives active debt from the machine-readable authority instead of Issue tags.
          path = Path('test/ci/verify-plasmon-test-inventory.mjs')
          text = path.read_text()
          import_anchor = "} from './plasmon-test-inventory.mjs';\n"
          if "from './plasmon-quarantine.mjs'" not in text:
              assert text.count(import_anchor) == 1
              text = text.replace(import_anchor, import_anchor + "import { activeQuarantines as activeQuarantineEntries, quarantineMarker } from './plasmon-quarantine.mjs';\n", 1)
          text, count = re.subn(
              r"const activeQuarantines = Object\.freeze\(\{[\s\S]*?\n\}\);\n",
              "const activeQuarantines = Object.freeze(Object.fromEntries(\n  [...new Set(activeQuarantineEntries.map((entry) => entry.path))].map((path) => [\n    path,\n    { count: activeQuarantineEntries.filter((entry) => entry.path === path).length },\n  ]),\n));\n",
              text,
              count=1,
          )
          assert count == 1
          old_assert = "  assert(specialistRunner.includes('--grep-invert') && specialistRunner.includes('@quarantine'), 'Specialist acceptance must exclude only explicitly tagged r2 quarantines with Playwright filtering');"
          new_assert = "  assert(specialistRunner.includes('--grep-invert') && specialistRunner.includes('quarantineMarker') && specialistRunner.includes('plasmon-quarantine.mjs'), 'Specialist acceptance must consume the shared quarantine marker authority');"
          assert text.count(old_assert) == 1
          text = text.replace(old_assert, new_assert, 1)
          text, count = re.subn(
              r"\n      for \(const issue of expected\.issues\) \{\n        assert\(quarantineTags\.some\(\(tag\) => tag\.includes\(issue\)\), `\$\{path\} active quarantine must remain linked to \$\{issue\}`\);\n      \}",
              "",
              text,
              count=1,
          )
          assert count == 1
          text = text.replace('explicitly tagged r2 quarantines', 'explicitly tagged quarantines')
          text, count = re.subn(
              r"  const quarantineDoc = await readFile\(resolve\(repoRoot, 'test/ci/QUARANTINED_BROWSER_TESTS\.md'\), 'utf8'\);[\s\S]*?\n\n  const fastWorkflow",
              "  const quarantineDoc = await readFile(resolve(repoRoot, 'test/ci/QUARANTINED_BROWSER_TESTS.md'), 'utf8');\n  assert(quarantineDoc.includes('plasmon-quarantine.json'), 'Quarantine documentation must point to the machine-readable authority');\n  assert(quarantineDoc.includes(quarantineMarker), 'Quarantine documentation must name the stable marker');\n  assert(!quarantineDoc.includes('@r2-quarantine') && !quarantineDoc.includes('@r3-quarantine'), 'Quarantine documentation must not define release-numbered active markers');\n  assert(activeQuarantineEntries.length === 1, 'Current executable quarantine debt must remain exactly one acceptance during this migration');\n  assert(activeQuarantineEntries[0].title === 'saved js-dos resource publishes a blob-backed preview after save', 'Saved-preview debt identity must remain unchanged');\n\n  const fastWorkflow",
              text,
              count=1,
          )
          assert count == 1
          path.write_text(text)

          # Flake Probe verifier checks authority consumption and exact-test semantics.
          path = Path('test/ci/verify-flake-probe.mjs')
          text = path.read_text()
          first_import = 'import { readFileSync } from "node:fs";\n'
          if 'from "./plasmon-quarantine.mjs"' not in text:
              assert text.count(first_import) == 1
              text = text.replace(first_import, first_import + 'import { isFullyQuarantinedSource, quarantineMarker } from "./plasmon-quarantine.mjs";\n', 1)
          text = text.replace('"--grep-invert @quarantine",', '"--grep-invert \\\"$quarantine_marker\\\"",')
          text = text.replace('  "@quarantine",\n]) {\n  requireFragment(specialistRunner, fragment, "automatic Specialist runner");', '  "quarantineMarker",\n  "plasmon-quarantine.mjs",\n]) {\n  requireFragment(specialistRunner, fragment, "automatic Specialist runner");')
          text = text.replace("        'test(\"synthetic quarantine fixture\", { tag: [\"@quarantine\"] }, async () => {});',", "        `test(\"synthetic quarantine fixture\", { tag: [\"${quarantineMarker}\"] }, async () => {});`,")
          old = '''function assertNoQuarantinedFiles(selection, label) {\n  for (const file of selection.files) {\n    if (readFileSync(file, "utf8").includes("@quarantine")) {\n      throw new Error(`${label} selected quarantined acceptance: ${file}`);\n    }\n  }\n}\n'''
          new = '''function assertNoQuarantinedFiles(selection, label) {\n  for (const file of selection.files) {\n    const source = readFileSync(file, "utf8");\n    if (isFullyQuarantinedSource(file, source)) {\n      throw new Error(`${label} selected a fully quarantined acceptance file: ${file}`);\n    }\n  }\n}\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text)

          # Labeled-probe verifier expects the dynamic runner boundary.
          path = Path('test/ci/verify-labeled-flake-probe.mjs')
          text = path.read_text()
          text = text.replace('"--grep-invert @quarantine",\n]) {\n  requireFragment(probeRunner, fragment, "flake-probe runner quarantine boundary");', '"test/ci/plasmon-quarantine.mjs --marker",\n  "--grep-invert \\\"$quarantine_marker\\\"",\n]) {\n  requireFragment(probeRunner, fragment, "flake-probe runner quarantine boundary");')
          path.write_text(text)
          PY

          # Parent-only migration scaffolding is not part of #531's final tree.
          git rm -f .github/workflows/r2r3-marker-migrate.yml || true
          git checkout origin/release/0.1.0-r2r3 -- .github/workflows/plasmon-ci.yml

          node test/ci/plasmon-quarantine.mjs --marker | grep -qx '@quarantine'
          ! git grep -n '@r2-quarantine' -- \
            .github/workflows/plasmon-browser-ci.yml \
            .github/workflows/plasmon-flake-probe-label.yml \
            test/ci/run-plasmon-specialist.mjs \
            test/ci/run-plasmon-flake-probe.sh \
            test/ci/select-plasmon-flake-characterization.mjs \
            test/ci/verify-plasmon-test-inventory.mjs \
            test/ci/verify-flake-probe.mjs \
            test/ci/verify-labeled-flake-probe.mjs \
            test/e2e/plasmon-demo-game.spec.ts
          test "$(git grep -n 'tag:.*@quarantine' -- 'test/e2e/*.spec.ts' | wc -l | tr -d ' ')" = 1
          node test/ci/verify-plasmon-test-inventory.mjs
          node test/ci/verify-flake-probe.mjs
          node test/ci/verify-labeled-flake-probe.mjs

          git add -A
          git commit -m '#531 Use one release-neutral quarantine authority'
          git rm .github/workflows/r2r3-quarantine-model-migrate.yml
          git commit -m '#531 Remove one-shot quarantine migration workflow'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
