name: Plasmon Train Snapshot
run-name: Plasmon Train Snapshot ${{ github.sha }}

# Install this exact file on branch automation/train-snapshot in
# plasmon-cloud/plasmon. The trigger commit is the queued signal; this helper
# publishes .train/status.json for connector-visible running/terminal state.

on:
  workflow_dispatch:
  push:
    branches:
      - automation/train-snapshot
    paths:
      - .train/refresh.txt
      - .github/workflows/plasmon-train-snapshot.yml

permissions:
  contents: write
  issues: read
  pull-requests: read
  checks: read
  actions: read

concurrency:
  group: plasmon-train-snapshot
  cancel-in-progress: true

env:
  TARGET_BRANCH: release/0.1.0-r2
  MILESTONE_TITLE: 0.1.0-r2
  SNAPSHOT_PATH: .train/snapshot.json
  STATUS_PATH: .train/status.json
  ARTIFACT_NAME: plasmon-train-snapshot

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/train-snapshot
          fetch-depth: 1

      - name: Publish running status
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          path = Path(os.environ["STATUS_PATH"])
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({
              "schema": "plasmon-train-bootstrap-status-v1",
              "generation": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "state": "running",
              "conclusion": None,
              "updated_at": dt.datetime.now(dt.timezone.utc).isoformat().replace("+00:00", "Z"),
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          git config user.name "plasmon-train-snapshot"
          git config user.email "plasmon-train-snapshot@users.noreply.github.com"
          git add "$STATUS_PATH"
          git commit -m "Mark Plasmon train snapshot running"
          git push origin HEAD:automation/train-snapshot

      - name: Build normalized train snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          REPO = os.environ["REPO"]
          TARGET = os.environ["TARGET_BRANCH"]
          MILESTONE_TITLE = os.environ["MILESTONE_TITLE"]
          OUT = Path(os.environ["SNAPSHOT_PATH"])
          DESIRE = {"High", "Medium", "Low"}
          EFFORT = {"Low", "Medium", "High"}

          def gh(path, *args):
              cmd = ["gh", "api", "--method", "GET", "-H", "X-GitHub-Api-Version: 2026-03-10", path, *args]
              return json.loads(subprocess.check_output(cmd, text=True))

          def gh_pages(path, params=None):
              params = params or {}
              page, rows = 1, []
              while True:
                  suffix = "&" if "?" in path else "?"
                  query = "&".join([*(f"{k}={v}" for k, v in params.items()), "per_page=100", f"page={page}"])
                  batch = gh(path + suffix + query)
                  if not isinstance(batch, list):
                      return batch
                  rows.extend(batch)
                  if len(batch) < 100:
                      return rows
                  page += 1

          def labels(issue):
              out = []
              for row in issue.get("labels") or []:
                  if isinstance(row, str):
                      out.append(row)
                  elif isinstance(row, dict) and row.get("name"):
                      out.append(row["name"])
              return sorted(set(out))

          def field_values(number):
              try:
                  rows = gh_pages(f"repos/{REPO}/issues/{number}/issue-field-values")
              except Exception as exc:
                  return {}, f"field-values-unavailable:{type(exc).__name__}"
              out = {}
              for row in rows if isinstance(rows, list) else []:
                  name = row.get("issue_field_name")
                  option = row.get("single_select_option") or {}
                  if name and option.get("name"):
                      out[str(name)] = str(option["name"])
              return out, None

          milestones = gh_pages(f"repos/{REPO}/milestones", {"state": "all"})
          milestone = next((x for x in milestones if x.get("title") == MILESTONE_TITLE), None)
          if not milestone:
              raise SystemExit(f"milestone {MILESTONE_TITLE!r} not found")

          raw_issues = gh_pages(f"repos/{REPO}/issues", {"milestone": milestone["number"], "state": "all", "direction": "asc"})
          raw_issues = [x for x in raw_issues if "pull_request" not in x]
          target_ref = gh(f"repos/{REPO}/git/ref/heads/{TARGET.replace('/', '%2F')}")
          target_sha = target_ref["object"]["sha"]
          raw_prs = gh_pages(f"repos/{REPO}/pulls", {"state": "open", "sort": "created", "direction": "asc"})
          lane_numbers = {int(x["number"]) for x in raw_issues}

          def map_pr(pr):
              body, title = str(pr.get("body") or ""), str(pr.get("title") or "")
              for source, pattern in [
                  (body, r"(?im)^\s*Plasmon-Issue\s*:\s*#(\d+)\b"),
                  (body, r"(?i)\b(?:closes|fixes|resolves)\s+#(\d+)\b"),
                  (title, r"^(#?)(\d+)\b"),
              ]:
                  match = re.search(pattern, source)
                  if match:
                      n = int(match.groups()[-1])
                      if n in lane_numbers:
                          return n
              return None

          pr_to_issue = {int(pr["number"]): issue for pr in raw_prs if (issue := map_pr(pr))}
          issue_to_pr = {issue: pr for pr, issue in pr_to_issue.items()}
          open_pr_heads = {str(pr.get("head", {}).get("ref") or "") for pr in raw_prs}

          dependency_map, dependency_states = {}, {}
          for issue in raw_issues:
              number = int(issue["number"])
              try:
                  deps = gh_pages(f"repos/{REPO}/issues/{number}/dependencies/blocked_by")
              except Exception:
                  deps = []
              nums, states = [], {}
              for dep in deps if isinstance(deps, list) else []:
                  if dep.get("number") is None:
                      continue
                  n = int(dep["number"]); nums.append(n); states[str(n)] = str(dep.get("state") or "unknown")
              dependency_map[number] = sorted(set(nums)); dependency_states[number] = states

          unlocks = {int(x["number"]): 0 for x in raw_issues}
          for deps in dependency_map.values():
              for parent in deps:
                  if parent in unlocks: unlocks[parent] += 1

          issues = []
          for raw in raw_issues:
              number = int(raw["number"])
              fields, field_error = field_values(number)
              labs = labels(raw)
              ci_owned = any(x.lower().startswith("ci:") for x in labs) or str(raw.get("title") or "").startswith("[r2 CI]")
              deps, states = dependency_map[number], dependency_states[number]
              dependencies_ready = all(str(states.get(str(n), "unknown")).lower() in {"closed", "completed", "merged", "integrated", "superseded", "waived"} for n in deps)
              desire, effort = fields.get("Desire"), fields.get("Effort")
              metadata_errors = []
              if field_error: metadata_errors.append(field_error)
              if not desire: metadata_errors.append("missing-desire")
              elif desire not in DESIRE: metadata_errors.append(f"invalid-desire:{desire}")
              if not effort: metadata_errors.append("missing-effort")
              elif effort not in EFFORT: metadata_errors.append(f"invalid-effort:{effort}")
              issues.append({
                  "number": number, "title": raw.get("title") or "", "open": str(raw.get("state") or "open").lower() == "open",
                  "product": not ci_owned, "ci_owned": ci_owned,
                  "assignees": [x.get("login") for x in raw.get("assignees") or [] if x.get("login")], "labels": labs,
                  "priority": fields.get("Priority"), "desire": desire, "effort": effort, "area": fields.get("Area"),
                  "type": (raw.get("type") or {}).get("name") if isinstance(raw.get("type"), dict) else raw.get("type"),
                  "scheduling_metadata": {"valid": not metadata_errors, "errors": metadata_errors},
                  "blocked_by": deps, "dependency_states": states, "dependencies_ready": dependencies_ready, "unlocks": unlocks.get(number, 0),
                  "open_pr": issue_to_pr.get(number), "url": raw.get("html_url"), "updated_at": raw.get("updated_at"),
              })
          issue_rows = {int(x["number"]): x for x in issues}

          def latest_check_runs(head_sha):
              payload = gh(f"repos/{REPO}/commits/{head_sha}/check-runs?filter=latest&per_page=100")
              best = {}
              for run in payload.get("check_runs") or []:
                  name = str(run.get("name") or "")
                  if name not in best or int(run.get("id") or 0) > int(best[name].get("id") or 0): best[name] = run
              return list(best.values())

          def flake_check(name):
              return "flake" in str(name or "").lower()

          def ci_state(checks):
              if not checks:
                  return "pending"
              failed = [x for x in checks if str(x.get("status") or "").lower() == "completed" and str(x.get("conclusion") or "").lower() not in {"success", "skipped", "neutral"}]
              if failed:
                  names = {str(x.get("name") or "").lower() for x in failed}
                  if names and all(flake_check(n) for n in names): return "flake"
                  if names and all("inherited" in n for n in names): return "inherited_failure"
                  if names and all("infra" in n or "infrastructure" in n for n in names): return "infra_failure"
                  return "unknown_red"
              if any(str(x.get("status") or "").lower() != "completed" for x in checks):
                  return "running"
              return "green"

          def flake_evidence(checks, head_sha, changed_files):
              """Parse explicit exact-head evidence and bind the failing test to this PR diff."""
              for run in checks:
                  if not flake_check(run.get("name")): continue
                  output = run.get("output") or {}
                  text = "\n".join(str(output.get(k) or "") for k in ("summary", "text"))
                  for line in text.splitlines():
                      if not line.startswith("PLASMON_FLAKE_EVIDENCE="): continue
                      try: row = json.loads(line.split("=", 1)[1])
                      except Exception: continue
                      if not isinstance(row, dict): continue
                      test = str(row.get("test") or "").strip()
                      producer_modified = row.get("modified_in_pr")
                      if producer_modified is None:
                          if changed_files is None or not test:
                              modified_in_pr = None
                          else:
                              matched = any(
                                  path and (test == path or test.startswith(path + "::") or test.startswith(path + ":") or path in test)
                                  for path in changed_files
                              )
                              modified_in_pr = True if matched else (False if "/" in test else None)
                      else:
                          modified_in_pr = bool(producer_modified)
                      return {
                          "head_matches": str(row.get("head_sha") or "") == head_sha,
                          "complete": bool(row.get("complete")), "infrastructure_collapse": bool(row.get("infrastructure_collapse")),
                          "test": row.get("test"), "passes": int(row.get("passes") or 0), "failures": int(row.get("failures") or 0),
                          "independent_confirmation": bool(row.get("independent_confirmation")),
                          "characterization_iterations": int(row.get("characterization_iterations") or 0),
                          "modified_in_pr": modified_in_pr,
                          "independent_from_pr": bool(row.get("independent_from_pr") or row.get("preexisting_canonical_flake")),
                          "source_check": run.get("name"), "source_url": run.get("details_url"),
                      }
              return None

          def review_facts(number, head_sha):
              reviews = gh_pages(f"repos/{REPO}/pulls/{number}/reviews")
              latest_by_user = {}
              for row in reviews:
                  user = str((row.get("user") or {}).get("login") or (row.get("user") or {}).get("id") or "unknown")
                  if int(row.get("id") or 0) >= int((latest_by_user.get(user) or {}).get("id") or 0): latest_by_user[user] = row
              blocking = [x for x in latest_by_user.values() if str(x.get("state") or "").upper() == "CHANGES_REQUESTED"]
              blocking.sort(key=lambda x: int(x.get("id") or 0), reverse=True); blocker = blocking[0] if blocking else None
              exact = [x for x in latest_by_user.values() if str(x.get("commit_id") or "") == head_sha]
              if blocker: review = "changes_requested"
              elif any(str(x.get("state") or "").upper() == "APPROVED" for x in exact): review = "approved"
              else: review = "pending"
              normalized = None
              if blocker:
                  normalized = {"id": blocker.get("id"), "state": blocker.get("state"), "commit_id": blocker.get("commit_id"), "body": blocker.get("body") or "", "user": (blocker.get("user") or {}).get("login")}
              return review, normalized

          prs = []
          for raw in raw_prs:
              number = int(raw["number"]); issue = pr_to_issue.get(number)
              if issue is None: continue
              detail = gh(f"repos/{REPO}/pulls/{number}")
              head_sha, base = detail["head"]["sha"], detail["base"]["ref"]
              checks = latest_check_runs(head_sha); ci = ci_state(checks); changed_files = None
              if ci == "flake":
                  try: changed_files = {str(x.get("filename") or "") for x in gh_pages(f"repos/{REPO}/pulls/{number}/files")}
                  except Exception: pass
              mergeable_state = str(detail.get("mergeable_state") or "unknown").lower()
              conflict = detail.get("mergeable") is False and mergeable_state == "dirty"
              review, blocker = review_facts(number, head_sha); issue_row = issue_rows[issue]
              prs.append({
                  "number": number, "issue": issue, "title": detail.get("title") or "", "state": "open", "head": head_sha,
                  "head_branch": detail["head"]["ref"], "base": base, "base_valid": base == TARGET or base in open_pr_heads,
                  "draft": bool(detail.get("draft")), "product": bool(issue_row["product"]), "ci_owned": bool(issue_row["ci_owned"]),
                  "conflict": bool(conflict), "mergeable": detail.get("mergeable"), "mergeable_state": mergeable_state,
                  "review": review, "blocking_review": blocker, "ci": ci, "flake_evidence": flake_evidence(checks, head_sha, changed_files),
                  "changed_test_files": sorted(x for x in (changed_files or set()) if x.startswith("test/")),
                  "checks": [{"name": x.get("name"), "status": x.get("status"), "conclusion": x.get("conclusion"), "url": x.get("details_url")} for x in checks],
                  "url": detail.get("html_url"), "updated_at": detail.get("updated_at"),
              })

          snapshot = {
              "schema": "plasmon-train-snapshot-v1", "captured_at": dt.datetime.now(dt.timezone.utc).isoformat().replace("+00:00", "Z"),
              "repo": REPO, "target": TARGET, "target_sha": target_sha, "milestone": MILESTONE_TITLE, "generation": os.environ["GITHUB_SHA"],
              "issues": issues, "prs": prs,
              "counts": {"issues": len(issues), "open_issues": sum(1 for x in issues if x["open"]), "open_product_prs": sum(1 for x in prs if x["product"]), "open_ci_prs": sum(1 for x in prs if x["ci_owned"]), "invalid_scheduling_metadata": sum(bool(x["scheduling_metadata"]["errors"]) for x in issues if x["open"])},
          }
          OUT.parent.mkdir(parents=True, exist_ok=True); tmp = OUT.with_suffix(".tmp")
          tmp.write_text(json.dumps(snapshot, indent=2, sort_keys=True) + "\n", encoding="utf-8"); tmp.replace(OUT)
          print(f"wrote {OUT} with {len(issues)} issues and {len(prs)} lane PRs")
          PY

      - name: Upload stable diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.SNAPSHOT_PATH }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish stable snapshot and success status
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          path = Path(os.environ["STATUS_PATH"])
          path.write_text(json.dumps({
              "schema": "plasmon-train-bootstrap-status-v1", "generation": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
              "state": "completed", "conclusion": "success", "updated_at": dt.datetime.now(dt.timezone.utc).isoformat().replace("+00:00", "Z"),
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          git add "$SNAPSHOT_PATH" "$STATUS_PATH"
          git commit -m "Refresh Plasmon train snapshot"
          git push origin HEAD:automation/train-snapshot

      - name: Publish failure status
        if: failure()
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          path = Path(os.environ["STATUS_PATH"])
          path.write_text(json.dumps({
              "schema": "plasmon-train-bootstrap-status-v1", "generation": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
              "state": "completed", "conclusion": "failure", "updated_at": dt.datetime.now(dt.timezone.utc).isoformat().replace("+00:00", "Z"),
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          git add "$STATUS_PATH"
          git commit -m "Mark Plasmon train snapshot failed" || true
          git push origin HEAD:automation/train-snapshot || true
