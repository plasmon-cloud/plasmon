name: Plasmon Fast CI

on:
  push:
    branches:
      - version-0.1.0-os
    paths:
      - "apps/plasmon/**"
      - "packages/neutron-design-system/**"
      - "packages/neutron-scripts/**"
      - "packages/neutron-tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/plasmon-ci.yml"
  pull_request:
    paths:
      - "apps/plasmon/**"
      - "packages/neutron-design-system/**"
      - "packages/neutron-scripts/**"
      - "packages/neutron-tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/plasmon-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plasmon-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Fast Bun tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Show toolchain
        run: |
          set -euxo pipefail
          node --version
          npm --version
          bun --version

      - name: Install dependencies
        run: npm ci

      - name: Plasmon fast tests
        run: npm --workspace neutron-plasmon test
