name: Plasmon Fast CI

on:
  push:
    branches:
      - version-0.1.0-os
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plasmon-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Fast Bun tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Verify complete Plasmon test inventory
        run: |
          set -euxo pipefail
          node test/ci/verify-plasmon-test-inventory.mjs
          node test/ci/verify-plasmon-test-inventory.mjs --self-test-orphan

      - name: Verify flake-probe workflow contract
        run: |
          set -euxo pipefail
          node test/ci/verify-flake-probe.mjs
          node test/ci/verify-labeled-flake-probe.mjs
          node test/ci/verify-flake-summary-human.mjs
          node test/ci/verify-playwright-packet-lifecycle.mjs

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Show toolchain
        run: |
          set -euxo pipefail
          node --version
          npm --version
          bun --version

      - name: Install dependencies
        run: npm ci

      - name: Verify Plasmon deployment command semantics
        run: npm run test:plasmon:deployment-commands

      - name: Plasmon fast tests
        timeout-minutes: 1
        run: npm --workspace neutron-plasmon test
