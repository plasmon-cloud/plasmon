name: Plasmon Packaged Browser CI

on:
  push:
    branches:
      - version-0.1.0-os
      - release/0.1.0-r2
    paths:
      - "apps/plasmon/**"
      - "apps/review/**"
      - "apps/kernel/**"
      - "packages/neutron-provision/**"
      - "packages/neutron-tools/**"
      - "test/e2e/plasmon-demo-environment.ts"
      - "test/e2e/plasmon-browser-health.ts"
      - "test/e2e/plasmon-refactor-smoke.spec.ts"
      - "test/e2e/plasmon-golden-path.spec.ts"
      - "test/e2e/plasmon-monaco-packaged.spec.ts"
      - "test/e2e/plasmon-review-demo.spec.ts"
      - "test/e2e/plasmon-emulatorjs-proof.spec.ts"
      - "test/e2e/plasmon-demo-game.spec.ts"
      - "playwright.config.ts"
      - "plasmon-local.ndeploy.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/plasmon-browser-ci.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plasmon-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-browser:
    name: Packaged Playwright specialist acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify required-gate workflow contract
        run: node test/ci/verify-required-browser-gates.mjs browser

      - name: Detect specialist-browser-relevant changes
        id: packaged_browser_scope
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_packaged_browser=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base_sha" "$head_sha" > /tmp/plasmon-specialist-browser-changed-files.txt
          cat /tmp/plasmon-specialist-browser-changed-files.txt

          run_packaged_browser=false
          while IFS= read -r path; do
            case "$path" in
              apps/plasmon/*|apps/review/*|apps/kernel/*|packages/neutron-provision/*|packages/neutron-tools/*|test/e2e/plasmon-demo-environment.ts|test/e2e/plasmon-browser-health.ts|test/e2e/plasmon-refactor-smoke.spec.ts|test/e2e/plasmon-golden-path.spec.ts|test/e2e/plasmon-monaco-packaged.spec.ts|test/e2e/plasmon-review-demo.spec.ts|test/e2e/plasmon-emulatorjs-proof.spec.ts|test/e2e/plasmon-demo-game.spec.ts|playwright.config.ts|plasmon-local.ndeploy.json|package.json|package-lock.json|.github/workflows/plasmon-browser-ci.yml)
                run_packaged_browser=true
                break
                ;;
            esac
          done < /tmp/plasmon-specialist-browser-changed-files.txt

          echo "run_packaged_browser=$run_packaged_browser" >> "$GITHUB_OUTPUT"
          if [ "$run_packaged_browser" != "true" ]; then
            echo "No specialist-browser-relevant changes; satisfying required Packaged Playwright specialist acceptance without packaging."
          fi

      - name: Install Nix
        if: steps.packaged_browser_scope.outputs.run_packaged_browser == 'true'
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and run Plasmon specialist browser acceptance
        if: steps.packaged_browser_scope.outputs.run_packaged_browser == 'true'
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm ci
            npm run plasmon:demo:prepare

            npm run plasmon:demo:serve > /tmp/plasmon-pocketic.log 2>&1 &
            server_pid=$!
            trap '\''status=$?; kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then cat /tmp/plasmon-pocketic.log || true; fi; exit "$status"'\'' EXIT

            pocketic_ready=0
            for attempt in $(seq 1 180); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                echo "PocketIC serve exited before becoming ready" >&2
                cat /tmp/plasmon-pocketic.log >&2 || true
                exit 1
              fi
              if grep -q "^PocketIC .* is ready$" /tmp/plasmon-pocketic.log 2>/dev/null; then
                pocketic_ready=1
                break
              fi
              sleep 1
            done
            if [ "$pocketic_ready" -ne 1 ]; then
              echo "PocketIC serve did not complete startup" >&2
              cat /tmp/plasmon-pocketic.log >&2 || true
              exit 1
            fi

            npm run plasmon:demo:status
            npm run plasmon:demo:reinstall
            npm run test:e2e:plasmon:specialist
          '
