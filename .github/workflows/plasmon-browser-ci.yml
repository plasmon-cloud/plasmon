name: Plasmon Packaged Browser CI

on:
  push:
    branches:
      - version-0.1.0-os
      - 'release/**'
  pull_request:
  pull_request_review:
    types: [submitted]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plasmon-browser-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packaged-browser:
    name: Packaged Playwright specialist acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify required-gate workflow contract
        run: node test/ci/verify-required-browser-gates.mjs browser

      - name: Report staged specialist checkpoint
        if: ${{ github.event_name != 'workflow_dispatch' && !(github.event_name == 'pull_request_review' && github.event.review.state == 'approved') }}
        run: |
          case "${{ github.event_name }}" in
            pull_request) echo "Specialist acceptance waits for normal GitHub review approval." ;;
            merge_group) echo "Specialist acceptance already passed before Merge; merge queue is fast-only." ;;
            push) echo "Specialist acceptance already passed before merge; post-merge Flake Probe owns stability analysis." ;;
            pull_request_review) echo "This review was not an approval; no expensive Specialist work is started." ;;
          esac

      - name: Install Nix
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') }}
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and run Plasmon specialist browser acceptance
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') }}
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm ci
            npm run plasmon:local:prepare

            npm run plasmon:local:serve > /tmp/plasmon-pocketic.log 2>&1 &
            server_pid=$!
            trap '\''status=$?; kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then cat /tmp/plasmon-pocketic.log || true; fi; exit "$status"'\'' EXIT

            pocketic_ready=0
            for attempt in $(seq 1 180); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                echo "PocketIC serve exited before becoming ready" >&2
                cat /tmp/plasmon-pocketic.log >&2 || true
                exit 1
              fi
              if grep -q "^PocketIC .* is ready$" /tmp/plasmon-pocketic.log 2>/dev/null; then
                pocketic_ready=1
                break
              fi
              sleep 1
            done
            if [ "$pocketic_ready" -ne 1 ]; then
              echo "PocketIC serve did not complete startup" >&2
              cat /tmp/plasmon-pocketic.log >&2 || true
              exit 1
            fi

            npm run plasmon:local:status
            npm run plasmon:local:reinstall
            npm run test:e2e:plasmon:specialist
          '

      - name: Upload Specialist Playwright report
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved')) }}
        uses: actions/upload-artifact@v4
        with:
          name: plasmon-specialist-report-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: error
          retention-days: 14

  packaged-demo:
    name: Packaged Playwright demo acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Report staged demo checkpoint
        if: ${{ github.event_name != 'workflow_dispatch' && !(github.event_name == 'pull_request_review' && github.event.review.state == 'approved') }}
        run: |
          case "${{ github.event_name }}" in
            pull_request) echo "Demo acceptance waits for normal GitHub review approval." ;;
            merge_group) echo "Demo acceptance already passed before Merge; merge queue is fast-only." ;;
            push) echo "Demo acceptance already passed before merge; post-merge Flake Probe owns stability analysis." ;;
            pull_request_review) echo "This review was not an approval; no expensive Demo work is started." ;;
          esac

      - name: Install Nix
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') }}
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and run Plasmon demo browser acceptance
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') }}
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm ci
            npm --workspace neutron-design-system run build
            npm run plasmon:demo:prepare

            npm run plasmon:demo:serve > /tmp/plasmon-demo-pocketic.log 2>&1 &
            server_pid=$!
            trap '\''status=$?; kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then cat /tmp/plasmon-demo-pocketic.log || true; fi; exit "$status"'\'' EXIT

            pocketic_ready=0
            for attempt in $(seq 1 180); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                echo "PocketIC demo serve exited before becoming ready" >&2
                cat /tmp/plasmon-demo-pocketic.log >&2 || true
                exit 1
              fi
              if grep -q "^PocketIC .* is ready$" /tmp/plasmon-demo-pocketic.log 2>/dev/null; then
                pocketic_ready=1
                break
              fi
              sleep 1
            done
            if [ "$pocketic_ready" -ne 1 ]; then
              echo "PocketIC demo serve did not complete startup" >&2
              cat /tmp/plasmon-demo-pocketic.log >&2 || true
              exit 1
            fi

            npm run plasmon:demo:status
            npm run plasmon:demo:reinstall
            npm run test:e2e:plasmon:demo
          '

      - name: Upload Demo Playwright report
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved')) }}
        uses: actions/upload-artifact@v4
        with:
          name: plasmon-demo-report-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: error
          retention-days: 14

  approval-rerun-sync:
    name: Sync approval reruns
    needs: [packaged-browser, packaged-demo]
    if: ${{ always() && github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.run_attempt > 1 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout trusted rerun coordinator
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - name: Propagate approval rerun to stale failed gates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node test/ci/rerun-stale-approval-gates.mjs
