name: Plasmon Packaged Browser CI

on:
  push:
    branches:
      - version-0.1.0-os
    paths:
      - "apps/plasmon/**"
      - "apps/review/**"
      - "apps/kernel/**"
      - "packages/neutron-provision/**"
      - "packages/neutron-tools/**"
      - "test/e2e/plasmon-golden-path.spec.ts"
      - "test/e2e/plasmon-monaco-packaged.spec.ts"
      - "test/e2e/plasmon-review-demo.spec.ts"
      - "test/e2e/plasmon-emulatorjs-proof.spec.ts"
      - "test/e2e/plasmon-demo-game.spec.ts"
      - "playwright.config.ts"
      - "plasmon-local.ndeploy.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/plasmon-browser-ci.yml"
  pull_request:
    paths:
      - "apps/plasmon/**"
      - "apps/review/**"
      - "apps/kernel/**"
      - "packages/neutron-provision/**"
      - "packages/neutron-tools/**"
      - "test/e2e/plasmon-golden-path.spec.ts"
      - "test/e2e/plasmon-monaco-packaged.spec.ts"
      - "test/e2e/plasmon-review-demo.spec.ts"
      - "test/e2e/plasmon-emulatorjs-proof.spec.ts"
      - "test/e2e/plasmon-demo-game.spec.ts"
      - "playwright.config.ts"
      - "plasmon-local.ndeploy.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/plasmon-browser-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plasmon-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-browser:
    name: Packaged Playwright golden path
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and run Plasmon browser acceptance
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm ci
            npm --workspace neutron-kernel run package
            npm --workspace neutron-plasmon run test:package
            npm --workspace neutron-review run package

            npm run provision -- plasmon-local.ndeploy.json serve > /tmp/plasmon-pocketic.log 2>&1 &
            server_pid=$!
            trap '\''status=$?; kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then cat /tmp/plasmon-pocketic.log || true; fi; exit "$status"'\'' EXIT

            pocketic_ready=0
            for attempt in $(seq 1 180); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                echo "PocketIC serve exited before becoming ready" >&2
                cat /tmp/plasmon-pocketic.log >&2 || true
                exit 1
              fi
              if grep -q "^PocketIC .* is ready$" /tmp/plasmon-pocketic.log 2>/dev/null; then
                pocketic_ready=1
                break
              fi
              sleep 1
            done
            if [ "$pocketic_ready" -ne 1 ]; then
              echo "PocketIC serve did not complete startup" >&2
              cat /tmp/plasmon-pocketic.log >&2 || true
              exit 1
            fi

            npm run provision -- plasmon-local.ndeploy.json status
            npm run provision -- plasmon-local.ndeploy.json reinstall
            NEUTRON_NDEPLOY_CONFIG=plasmon-local.ndeploy.json \
              npx playwright test \
                test/e2e/plasmon-golden-path.spec.ts \
                test/e2e/plasmon-monaco-packaged.spec.ts \
                test/e2e/plasmon-review-demo.spec.ts \
                test/e2e/plasmon-emulatorjs-proof.spec.ts \
                test/e2e/plasmon-demo-game.spec.ts
          '
