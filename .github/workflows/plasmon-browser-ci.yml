name: Plasmon Packaged Browser CI

on:
  push:
    branches:
      - version-0.1.0-os
      - 'release/**'
  pull_request:
  pull_request_review:
    types: [submitted]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: plasmon-browser-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packaged-browser:
    name: Packaged Playwright specialist acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify required-gate workflow contract
        run: node test/ci/verify-required-browser-gates.mjs browser

      - name: Detect retained approval
        id: retained_approval
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          owner="${REPOSITORY%%/*}"
          name="${REPOSITORY#*/}"
          decision="$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewDecision}}}' \
            -F owner="$owner" -F name="$name" -F number="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.reviewDecision')"
          approved_review_ids="$(gh api --paginate \
            "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" \
            --jq '.[] | select(.state == "APPROVED") | .id')"
          dismissed_approval_ids="$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/$REPOSITORY/issues/$PR_NUMBER/timeline?per_page=100" \
            --jq '.[] | select(.event == "review_dismissed" and .dismissed_review.state == "approved") | .id')"
          if [ "$decision" = "APPROVED" ] || [ -n "$approved_review_ids" ] || [ -n "$dismissed_approval_ids" ]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report staged specialist checkpoint
        if: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'pull_request' && github.event_name != 'pull_request_review' && !(github.event_name == 'pull_request' && steps.retained_approval.outputs.approved == 'true') }}
        run: |
          case "${{ github.event_name }}" in
            pull_request) echo "Specialist acceptance runs on every PR head before and after approval." ;;
            merge_group) echo "Specialist acceptance already passed before Merge; merge queue is fast-only." ;;
            push) echo "Specialist acceptance already passed before merge; post-merge Flake Probe owns stability analysis." ;;
            pull_request_review) echo "Specialist acceptance reruns for submitted reviews so a review event cannot replace a real Specialist result with a cheap checkpoint." ;;
          esac

      - name: Install Nix
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') || (github.event_name == 'pull_request' && steps.retained_approval.outputs.approved == 'true') }}
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and run Plasmon specialist browser acceptance
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') || (github.event_name == 'pull_request' && steps.retained_approval.outputs.approved == 'true') }}
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm ci
            PLASMON_RUNTIME_CONFIGURATION=demo-games PLASMON_DEMO_GAME_FIXTURE=1 PLASMON_EMULATORJS_TEST_FIXTURE=1 npm run plasmon:local:prepare

            npm run plasmon:local:serve > /tmp/plasmon-pocketic.log 2>&1 &
            server_pid=$!
            trap '\''status=$?; kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then cat /tmp/plasmon-pocketic.log || true; fi; exit "$status"'\'' EXIT

            pocketic_ready=0
            for attempt in $(seq 1 180); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                echo "PocketIC serve exited before becoming ready" >&2
                cat /tmp/plasmon-pocketic.log >&2 || true
                exit 1
              fi
              if grep -q "^PocketIC .* is ready$" /tmp/plasmon-pocketic.log 2>/dev/null; then
                pocketic_ready=1
                break
              fi
              sleep 1
            done
            if [ "$pocketic_ready" -ne 1 ]; then
              echo "PocketIC serve did not complete startup" >&2
              cat /tmp/plasmon-pocketic.log >&2 || true
              exit 1
            fi

            npm run plasmon:local:status
            npm run plasmon:local:reinstall
            npm run test:e2e:plasmon:specialist
          '

      - name: Upload Specialist Playwright report
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') || (github.event_name == 'pull_request' && steps.retained_approval.outputs.approved == 'true')) }}
        uses: actions/upload-artifact@v4
        with:
          name: plasmon-specialist-report-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: error
          retention-days: 14

  packaged-demo:
    name: Packaged Playwright demo acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect retained approval
        id: retained_approval
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          owner="${REPOSITORY%%/*}"
          name="${REPOSITORY#*/}"
          decision="$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewDecision}}}' \
            -F owner="$owner" -F name="$name" -F number="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.reviewDecision')"
          approved_review_ids="$(gh api --paginate \
            "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" \
            --jq '.[] | select(.state == "APPROVED") | .id')"
          dismissed_approval_ids="$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/$REPOSITORY/issues/$PR_NUMBER/timeline?per_page=100" \
            --jq '.[] | select(.event == "review_dismissed" and .dismissed_review.state == "approved") | .id')"
          if [ "$decision" = "APPROVED" ] || [ -n "$approved_review_ids" ] || [ -n "$dismissed_approval_ids" ]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report staged demo checkpoint
        if: ${{ github.event_name != 'workflow_dispatch' && !(github.event_name == 'pull_request_review' && github.event.review.state == 'approved') && !(github.event_name == 'pull_request' && steps.retained_approval.outputs.approved == 'true') }}
        run: |
          case "${{ github.event_name }}" in
            pull_request) echo "Demo acceptance waits for the PR's first GitHub review approval." ;;
            merge_group) echo "Demo acceptance already passed before Merge; merge queue is fast-only." ;;
            push) echo "Demo acceptance already passed before merge; post-merge Flake Probe owns stability analysis." ;;
            pull_request_review) echo "This review was not an approval; no expensive Demo work is started." ;;
          esac

      - name: Install Nix
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') || (github.event_name == 'pull_request' && steps.retained_approval.outputs.approved == 'true') }}
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and run Plasmon demo browser acceptance
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') || (github.event_name == 'pull_request' && steps.retained_approval.outputs.approved == 'true') }}
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm ci
            npm --workspace neutron-design-system run build
            npm run plasmon:demo:prepare

            npm run plasmon:demo:serve > /tmp/plasmon-demo-pocketic.log 2>&1 &
            server_pid=$!
            trap '\''status=$?; kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then cat /tmp/plasmon-demo-pocketic.log || true; fi; exit "$status"'\'' EXIT

            pocketic_ready=0
            for attempt in $(seq 1 180); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                echo "PocketIC demo serve exited before becoming ready" >&2
                cat /tmp/plasmon-demo-pocketic.log >&2 || true
                exit 1
              fi
              if grep -q "^PocketIC .* is ready$" /tmp/plasmon-demo-pocketic.log 2>/dev/null; then
                pocketic_ready=1
                break
              fi
              sleep 1
            done
            if [ "$pocketic_ready" -ne 1 ]; then
              echo "PocketIC demo serve did not complete startup" >&2
              cat /tmp/plasmon-demo-pocketic.log >&2 || true
              exit 1
            fi

            npm run plasmon:demo:status
            npm run plasmon:demo:reinstall
            npm run test:e2e:plasmon:demo
          '

      - name: Upload Demo Playwright report
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') || (github.event_name == 'pull_request' && steps.retained_approval.outputs.approved == 'true')) }}
        uses: actions/upload-artifact@v4
        with:
          name: plasmon-demo-report-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: error
          retention-days: 14
