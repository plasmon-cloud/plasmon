<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Plasmon Demo Artwork</title>
  <desc id="desc">Abstract vector artwork with glowing orbital rings around a central Plasmon mark.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#17253f"/>
      <stop offset="1" stop-color="#0b1728"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#e8fff8"/>
      <stop offset="0.35" stop-color="#83f3cf"/>
      <stop offset="1" stop-color="#2ab5e8"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#72d7ff"/>
      <stop offset="0.5" stop-color="#f4d77c"/>
      <stop offset="1" stop-color="#8cf1ca"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="720" rx="40" fill="url(#background)"/>

  <g opacity="0.24" fill="none" stroke="#7edcff">
    <circle cx="600" cy="330" r="250"/>
    <circle cx="600" cy="330" r="310"/>
    <circle cx="600" cy="330" r="370"/>
  </g>

  <g transform="translate(600 330)" fill="none" stroke="url(#orbit)" stroke-width="18" stroke-linecap="round">
    <ellipse rx="330" ry="112" transform="rotate(-18)"/>
    <ellipse rx="330" ry="112" transform="rotate(42)" opacity="0.74"/>
    <ellipse rx="330" ry="112" transform="rotate(102)" opacity="0.48"/>
  </g>

  <circle cx="600" cy="330" r="104" fill="#53c8eb" opacity="0.22" filter="url(#glow)"/>
  <circle cx="600" cy="330" r="76" fill="url(#core)"/>
  <circle cx="600" cy="330" r="24" fill="#071421" opacity="0.72"/>

  <g fill="#f6fbff">
    <circle cx="306" cy="424" r="12"/>
    <circle cx="843" cy="150" r="9"/>
    <circle cx="920" cy="438" r="7"/>
  </g>

  <text x="600" y="610" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="700" fill="#f5f9ff">Plasmon Demo</text>
  <text x="600" y="655" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" letter-spacing="5" fill="#9ec8dd">VECTOR ARTWORK</text>
</svg>
