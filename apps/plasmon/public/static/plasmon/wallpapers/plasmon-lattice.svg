<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Same 145deg three-stop field as the original CSS wallpaper. -->
    <linearGradient id="base" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1600" y2="900">
      <stop stop-color="#071821"/>
      <stop offset=".52" stop-color="#0b2834"/>
      <stop offset="1" stop-color="#071821"/>
    </linearGradient>
    <radialGradient id="glow-a" gradientUnits="userSpaceOnUse" cx="288" cy="180" r="544">
      <stop stop-color="#65ddb0" stop-opacity=".24"/>
      <stop offset="1" stop-color="#65ddb0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-b" gradientUnits="userSpaceOnUse" cx="1312" cy="666" r="576">
      <stop stop-color="#3aa9c8" stop-opacity=".17"/>
      <stop offset="1" stop-color="#3aa9c8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lattice" width="106" height="106" patternUnits="userSpaceOnUse" patternTransform="rotate(4) scale(1.08)">
      <path d="M-26 26 26-26M0 106 106 0M80 132 132 80" fill="none" stroke="#65ddb0" stroke-opacity=".12" stroke-width="2"/>
      <path d="M-26 -26 132 132M-26 80 26 132M80 -26 132 26" fill="none" stroke="#3aa9c8" stroke-opacity=".1" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#base)"/>
  <rect width="1600" height="900" fill="url(#glow-a)"/>
  <rect width="1600" height="900" fill="url(#glow-b)"/>
  <!-- CSS ::before was inset by 18%, then rotated and scaled. -->
  <rect x="-288" y="-162" width="2176" height="1224" fill="url(#lattice)" opacity=".7"/>
</svg>
