      <stop stop-color="#190612"/>
      <stop offset=".52" stop-color="#1b0a13"/>
      <stop offset="1" stop-color="#4a1730"/>
    </linearGradient>
    <radialGradient id="bloom-a" cx="72%" cy="38%" r="24%">
      <stop stop-color="#f27691" stop-opacity=".25"/>
