<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(38 .5 .5)">
      <stop stop-color="#070611"/>
      <stop offset=".54" stop-color="#090817"/>
      <stop offset="1" stop-color="#1e1438"/>
    </linearGradient>
    <radialGradient id="halo" cx="73%" cy="37%" r="38%">
      <stop stop-color="#aa91ff" stop-opacity=".3"/>
      <stop offset=".06" stop-color="#aa91ff" stop-opacity="0"/>
      <stop offset=".14" stop-color="#7864e8" stop-opacity=".15"/>
      <stop offset=".16" stop-color="#7864e8" stop-opacity="0"/>
      <stop offset=".38" stop-color="#aa91ff" stop-opacity=".11"/>
      <stop offset=".4" stop-color="#aa91ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#aa91ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stars" width="79" height="79" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="16" r="1" fill="#d3c8ff" fill-opacity=".58"/>
    </pattern>
    <ellipse id="orbit" cx="1168" cy="333" rx="610" ry="258" fill="none" stroke="#aa91ff" stroke-opacity=".24" stroke-width="2" transform="rotate(-19 1168 333)"/>
  </defs>
  <rect width="1600" height="900" fill="url(#base)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#stars)" opacity=".12"/>
  <use href="#orbit"/>
</svg>
