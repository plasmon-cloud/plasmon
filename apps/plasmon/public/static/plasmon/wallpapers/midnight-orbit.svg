<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="700" y2="1000">
      <stop stop-color="#070611"/>
      <stop offset=".54" stop-color="#090817"/>
      <stop offset="1" stop-color="#1e1438"/>
    </linearGradient>
    <radialGradient id="halo" gradientUnits="userSpaceOnUse" cx="1168" cy="333" r="608">
      <stop stop-color="#aa91ff" stop-opacity=".30" offset="0"/>
      <stop stop-color="#aa91ff" stop-opacity="0" offset=".06"/>
      <stop stop-color="#7864e8" stop-opacity=".15" offset=".14"/>
      <stop stop-color="#7864e8" stop-opacity="0" offset=".16"/>
      <stop stop-color="#aa91ff" stop-opacity=".11" offset=".38"/>
      <stop stop-color="#aa91ff" stop-opacity="0" offset=".40"/>
      <stop stop-color="#aa91ff" stop-opacity="0" offset="1"/>
    </radialGradient>
    <radialGradient id="aurora-a" gradientUnits="userSpaceOnUse" cx="1136" cy="289" r="290">
      <stop stop-color="#aa91ff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#aa91ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora-b" gradientUnits="userSpaceOnUse" cx="656" cy="900" r="500">
      <stop stop-color="#7864e8" stop-opacity=".11"/>
      <stop offset="1" stop-color="#7864e8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stars" width="79" height="79" patternUnits="userSpaceOnUse">
      <circle cx="39.5" cy="39.5" r="1" fill="#d3c8ff" fill-opacity=".58"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#base)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <!-- These soft fields are the two blurred CSS aurora companions. -->
  <rect width="1600" height="900" fill="url(#aurora-a)"/>
  <rect width="1600" height="900" fill="url(#aurora-b)"/>
  <!-- CSS radial-gradient(circle) repeated every 79px. -->
  <rect width="1600" height="900" fill="url(#stars)" opacity=".12"/>
  <!-- The former pseudo-element: 980px x 684px, positioned at (908,-448),
       then scaleY(.42) and rotate(-19deg). -->
  <ellipse cx="1398" cy="-106" rx="490" ry="144" fill="none" stroke="#aa91ff" stroke-opacity=".24" stroke-width="2" transform="rotate(-19 1398 -106)"/>
</svg>
